 * The width/height fntRenderString is called with. Only the mutable-text types
 * ever pass a box; everything else passes 0,0, meaning no clipping and no
 * newline handling (§6.2). DIM_UNDEF must never reach the clipper as -1.
 */
function textBox(el) {
  const ex = el.extended || {};
  if (ex.sizingMode === undefined || ex.sizingMode === SIZING_NONE) return { w:0, h:0 };
  return { w: el.width === DIM_UNDEF ? 0 : el.width, h: el.height === DIM_UNDEF ? 0 : el.height };
}

function drawSingleText(el, str) {
  const box = textBox(el);
  const ex = el.extended || {};
  if (ex.sizingMode === SIZING_WRAP && box.w)
    str = fitString(s => textWidth(s, fontSpec(el)), String(str), box.w);
  renderString(el, el.posX, el.posY, el.aligned, box.w, box.h, str, el.color);
  return textRect(el, String(str), box);
}

/** Inline strip of several attributes, separated, skipping absent ones.
 *  Mirrors drawAttributeList in themes.c: the pen advances by each measured
 *  value, so gaps are constant instead of depending on how long a value is.
 *  A missing value takes its separator with it -- no dangling bullet. */
function drawAttributeList(el, game) {
  const ex = el.extended || {};
  const keys = ex.keys || [];
  const sep = ex.separator ?? "·";
  const gap = ex.gap ?? 6;
  const spec = fontSpec(el);
  const limit = el.width > 0 ? el.posX + el.width : SCREEN_W;
  let pen = el.posX, drawn = 0;
  for (const k of keys) {
    let v = gameAttr(game, k);
    if (v === null || v === undefined || v === "") continue;
    // #Size carries no unit in the config; AttributeText appends it at draw
    // time and this must match, or the previewer disagrees with the console.
    if (/^#?size$/i.test(k)) v = `${v} MiB`;
    if (drawn) {
      const sw = textWidth(sep, spec);
      if (pen + gap + sw + gap > limit) break;
      renderString(el, pen + gap, el.posY, ALIGN_NONE, 0, 0, sep, el.color);
      pen += gap + sw + gap;
    }
    const w = textWidth(String(v), spec);
    if (pen + w > limit) break;
    renderString(el, pen, el.posY, ALIGN_NONE, 0, 0, String(v), el.color);
    pen += w;
    drawn++;
  }
  return { x: el.posX, y: el.posY, w: pen - el.posX, h: spec.size };
}

function drawAttributeText(el, game) {
  const ex = el.extended;
  const box = textBox(el);
  let value = ex.value ? gameAttr(game, ex.value) : null;
  let out;
  if (value !== null && value !== undefined) {
    const isSize = /^#?size$/i.test(ex.value);
    if (ex.displayMode === DISPLAY_NEVER) out = isSize ? `${value} MiB` : value;
    else out = isSize ? `${ex.alias}${value} MiB` : `${ex.alias}${value}`;
  } else if (ex.displayMode === DISPLAY_ALWAYS) {
    out = ex.alias ?? "";
  } else return { x:el.posX, y:el.posY, w:0, h:0 };
  if (ex.sizingMode === SIZING_WRAP && box.w)
    out = fitString(s => textWidth(s, fontSpec(el)), out, box.w);
  renderString(el, el.posX, el.posY, el.aligned, box.w, box.h, out, el.color);
  return textRect(el, out, box);
}

/** A selectable rect around rendered text, matching where the glyphs land. */
function textRect(el, str, box) {
  const spec = fontSpec(el);
  const lines = String(str).split("\n");
  const w = box.w ? Math.min(Math.max(...lines.map(l => textWidth(l, spec))), box.w)
                  : Math.max(...lines.map(l => textWidth(l, spec)), 0);
  const h = Math.max(spec.size, lines.length * (box.w ? MENU_ITEM_HEIGHT : spec.size));
  let x = el.posX, y = el.posY;
  if (el.aligned & 8) x -= w >> 1;
  const top = (el.aligned & 2) ? y + ((spec.size - 4) >> 1) : y + (spec.size - 2);
  return { x, y: top - spec.size + 3, w: Math.max(w, 4), h };
}

/** A hard 2px selection frame, four filled rects — no rounding, no glow. */
function drawCellFrame(x, y, w, h, t, color) {
  if (t <= 0 || w <= 0 || h <= 0) return;
  ctx.fillStyle = rgb(color);
  ctx.fillRect(x, y, w, t);
  ctx.fillRect(x, y + h - t, w, t);
  ctx.fillRect(x, y + t, t, h - 2 * t);
  ctx.fillRect(x + w - t, y + t, t, h - 2 * t);
}
function markSelectedTile(q) {
  drawCellFrame(q.x, q.y, q.w, q.h, 2, S.theme.selTextColor);
}

/** Grid branch of drawItemsList — see patches/opl-tile-grid.patch. */
function drawItemsListGrid(el, posX, posY) {
  const ex = el.extended;
  const labelH = ex.showText ? ex.labelHeight : 0;
  const artW = ex.cellWidth - ex.gap, artH = ex.cellHeight - ex.gap - labelH;
  el._cells = [];
  if (artW < 1 || artH < 1) return { x:posX, y:posY, w:el.width, h:el.height };

  // Narrow the pitch by the same 3/4 rmDrawPixmap applies to a scaled image,
  // so the tiles keep their shape AND the grid keeps its proportions in 16:9.
  const wide = (el.scaled & SCALING_RATIO) !== 0;
  const pitchX = wide ? (ex.cellWidth * S.aspect) >> 2 : ex.cellWidth;
  const drawnW = wide ? (artW * S.aspect) >> 2 : artW;
  const gridW = pitchX * ex.columns;
  if (el.aligned) { posX -= gridW >> 1; posY -= el.height >> 1; }

  for (let n = 0; n < ex.displayedItems; n++) {
    const g = gameList()[S.pageStart + n];
    if (!g) break;
    const cx = posX + (n % ex.columns) * pitchX;
    const cy = posY + Math.floor(n / ex.columns) * ex.cellHeight;
    const selected = (S.pageStart + n === S.gameIndex);
    const q = setupQuad(cx, cy, ALIGN_NONE, artW, artH, el.scaled, S.aspect);

    if (ex.decoratorImage) {
      const img = gameArt(g.serial, ex.decoratorImage.extended.pattern)
               || themeImage(ex.decoratorImage.extended.defaultTexture);
      if (img && img.complete && img.naturalWidth) ctx.drawImage(img, q.x, q.y, q.w, q.h);
      else drawStub(q, ex.decoratorImage.extended.pattern || "");
    }
    if (selected && ex.frameSize > 0)
      drawCellFrame(q.x, q.y, q.w, q.h, ex.frameSize, S.theme.selTextColor);
    if (ex.showText)
      renderString(el, cx, cy + artH, ALIGN_NONE, drawnW, ex.labelHeight, g.title,
                   selected ? S.theme.selTextColor : el.color);

    el._cells.push({ x:q.x, y:cy, w:q.w, h:ex.cellHeight, index:S.pageStart + n });
  }
  return { x:posX, y:posY, w:gridW, h:el.height };
}

/**
 * MenuTabs — every visible device drawn at once, current one framed. Needs
 * patches/03-opl-menu-tabs.patch. Layout mirrors guiAlignMenuHints: measure the
 * whole strip, then centre it on posX when aligned.
 */
function drawMenuTabs(el) {
  const ex = el.extended;
  const spec = fontSpec(el);
  const hintSpec = fontSpec({ font: ex.hintFont });
  // OPL's device order: BDM slots, then ETH, HDD, APP.
  const shown = DEVICES.slice(0, S.deviceCount).map(d => ex.labels[d.kind] || d.name);
  const mid = el.posY + (el.height >> 1);
  const tabW = n => textWidth(n, spec) + 2 * ex.pad;

  let total = shown.reduce((n, d) => n + tabW(d), 0) + (shown.length - 1) * el.width;
  if (ex.prevText) total += textWidth(ex.prevText, hintSpec) + el.width;
  if (ex.nextText) total += textWidth(ex.nextText, hintSpec) + el.width;

  let x = el.posX;
  if (el.aligned) x -= total >> 1;
  const startX = x;

  const hintColor = ex.hintColor || el.color;
  if (ex.prevText) {
    renderString({ font: ex.hintFont }, x, mid, 2, 0, 0, ex.prevText, hintColor);
    x += textWidth(ex.prevText, hintSpec) + el.width;
  }

  shown.forEach((name, i) => {
    const w = tabW(name);
    if (i === S.device) {
      // Round cap, plain fill, round cap — the caps scale with the glyphs so the
      // pill stays wrapped around the text in 16:9 too.
      const capSrc = el.height >> 1;
      const capW = (el.scaled & SCALING_RATIO) ? (capSrc * S.aspect) >> 2 : capSrc;
      const l = themeImage(ex.capLeft), r = themeImage(ex.capRight);
      if (l && r && l.complete && r.complete) {
        const tinted = img => tintedCopy(img, { r:ex.selColor.r >> 1, g:ex.selColor.g >> 1, b:ex.selColor.b >> 1 });
        ctx.drawImage(tinted(l), x, el.posY, capW, el.height);
        if (w - 2 * capW > 0) {
          ctx.fillStyle = rgb(ex.selColor);
          ctx.fillRect(x + capW, el.posY, w - 2 * capW, el.height);
        }
        ctx.drawImage(tinted(r), x + w - capW, el.posY, capW, el.height);
      } else if (ex.frameSize > 0) {
        drawCellFrame(x, el.posY, w, el.height, ex.frameSize, ex.selColor);
      }
      renderString(el, x + ex.pad, mid, 2, 0, 0, name, ex.selTextColor);
    } else {
      renderString(el, x + ex.pad, mid, 2, 0, 0, name, el.color);
    }
    x += w + el.width;
  });

  if (ex.nextText) renderString({ font: ex.hintFont }, x, mid, 2, 0, 0, ex.nextText, hintColor);
  return { x: startX, y: el.posY, w: x - startX, h: el.height };
}

/** drawItemsList (themes.c:840) — §5.2, including the decorator/text mismatch. */
function drawItemsList(el) {
  const ex = el.extended;
  const n = ex.displayedItems;
  if (S.gameIndex < S.pageStart) S.pageStart = S.gameIndex;
  if (S.gameIndex >= S.pageStart + n) S.pageStart = S.gameIndex - n + 1;
  S.pageStart = Math.max(0, Math.min(S.pageStart, Math.max(0, gameList().length - n)));
  // The patch scrolls a grid by whole rows, so the page start stays aligned.
  if (ex.columns > 1) S.pageStart -= S.pageStart % ex.columns;

  if (ex.columns > 1) return drawItemsListGrid(el, el.posX, el.posY);
  let posX = el.posX, posY = el.posY;
  if (el.aligned) { posX -= el.width >> 1; posY -= el.height >> 1; }
  el._cells = null;
  const top = posY;

  for (let i = 0; i < n; i++) {
    const g = gameList()[S.pageStart + i];
    if (!g) break;
    const color = (S.pageStart + i === S.gameIndex) ? S.theme.selTextColor : el.color;
    if (ex.decoratorImage) {
      const icon = gameArt(g.serial, ex.decoratorImage.extended.pattern);
      const q = setupQuad(posX, posY, el.aligned, DECORATOR_SIZE, DECORATOR_SIZE, el.scaled, S.aspect);
      if (icon && icon.complete && icon.naturalWidth) ctx.drawImage(icon, q.x, q.y, q.w, q.h);
      else drawStub(q, "");
      // NOTE: OPL uses elem->posX here, not the centred posX (§5.2 quirk).
      renderString(el, el.posX + DECORATOR_SIZE, posY, el.aligned, el.width, el.height, g.title, color);
    } else {
      renderString(el, el.posX, posY, el.aligned, el.width, el.height, g.title, color);
    }
    posY += MENU_ITEM_HEIGHT;
  }
  el._rows = { top, count: Math.min(n, gameList().length - S.pageStart), x: posX };
  return { x: el.aligned ? el.posX - (el.width >> 1) : el.posX, y: top, w: el.width, h: el.height };
}

function drawMenuText(el) {
  const label = S.chain.startsWith("apps") ? "Apps" : deviceName(S.device);
  const spec = fontSpec(el);
  // Arrows appear only when another device is actually connected.
  const hasPrev = S.device > 0, hasNext = S.device < S.deviceCount - 1;
  const arrow = (x, name) => {
    const q = setupQuad(x, el.posY, el.aligned, 20, 20, el.scaled, S.aspect);
    const img = themeImage(name);
    if (img && img.complete && img.naturalWidth) ctx.drawImage(img, q.x, q.y, q.w, q.h);
    else drawStub(q, name === "left" ? "\u2039" : "\u203a");
  };
  if (el.aligned) {
    const off = el.width >> 1;
    if (hasPrev) arrow(el.posX - off, "left");
    if (hasNext) arrow(el.posX + off, "right");
  } else {
    if (hasPrev) arrow(el.posX - 20, "left");
    if (hasNext) arrow(el.posX + el.width, "right");
  }
  renderString(el, el.posX, el.posY, el.aligned, 0, 0, label, el.color);
  const w = textWidth(label, spec);
  return { x: (el.aligned & 8) ? el.posX - (w >> 1) : el.posX, y: el.posY, w: Math.max(w, el.width), h: spec.size + 4 };
}

/**
 * drawHintText (themes.c:915): icon + label pairs, `width` used as the gap
 * between them, `aligned` centring the whole row (guiAlignMenuHints).
 */
/**
 * guiDrawIconAndText (gui.c:1312): the icon is always drawn 20px tall, its width
 * derived from the source aspect, then the label follows 2px later. A theme can
 * replace any of these by shipping circle.png, cross.png, triangle.png,
 * square.png, start.png or select.png, which is how you get plain shapes instead
 * of OPL's button graphics.
 */
function hintIconWidth(name) {
  const img = themeImage(name);
  if (img && img.complete && img.naturalHeight) return Math.round(img.naturalWidth * 20 / img.naturalHeight);
  return 20;
}
function drawHints(el, hints) {
  const spec = fontSpec(el);
  let x = el.posX;
  if (el.aligned) {
    let total = SCREEN_W;
    hints.forEach((h, i) => {
      total -= ((hintIconWidth(h[0]) * S.aspect) >> 2) + 2 + textWidth(h[1], spec);
      if (i !== hints.length - 1) total -= el.width;
    });
    x = total >> 1;
  }
  const startX = x;
  for (const [icon, label] of hints) {
    const img = themeImage(icon);
    const w = hintIconWidth(icon);
    const q = setupQuad(x, el.posY + 10, ALIGN_CENTER & 2, w, 20, SCALING_RATIO, S.aspect);
    if (img && img.complete && img.naturalWidth) ctx.drawImage(img, q.x, q.y, q.w, q.h);
    else drawStub(q, icon.slice(0, 3));
    x += q.w + 2;
    renderString(el, x, el.posY + 10, ALIGN_CENTER & 2, 0, 0, label, el.color);
    x += textWidth(label, spec) + el.width;
  }
  return { x: startX, y: el.posY, w: x - startX - el.width, h: 20 };
}

/* ------------------------------------------------------------ frame draw */

/* ------------------------------------------- SHELF Apps page (Phase 5 mock)

   Not a theme page. The SHELF pages are hardcoded C that draws with rmDrawRect,
   rmDrawLine and fntRenderString, so there is no conf_theme.cfg to preview and
   no element chain to inspect -- the tree and inspector are empty on this tab
   by design.

   What it is for: the geometry and the text metrics are the two things a design
   doc cannot settle in prose. Card widths are only trustworthy once real glyph
   advances have been run through them, and this reuses the previewer's own
   measurement path, which is the same path that caught the fontSpec bug. If a
   subtitle does not fit here, it will not fit on the console.

   Colours are shelf.c's palette verbatim, so the page reads as part of the
   panel it is reached from rather than as a separate screen.
*/
const SHELF_PAL = {
  pageBg:  0x0F1216, barBg:   0x181C22, rule:    0x2A3038,
  card:    0x1C2027, cardSel: 0x262C35, cardEdge:0x2A3038,
  icon:    0x2E353F, text:    0xF2F5F8, muted:   0x5C6674, dim: 0x3C444E,
  sel:     0xF2F5F8, net:     0x64C878, netOff:  0x6E7681,
};
const rgbHex = (h) => `rgb(${(h>>16)&255},${(h>>8)&255},${h&255})`;

// One entry per card. `sub` is the subtitle whose source Phase 5 has to choose;
// the longest realistic one is here on purpose, to size the card against the
// worst case rather than the average.
const SHELF_APPS_MOCK = [
  { name:"OPL",            sub:"v1.2.0-Beta-2216" },
  { name:"wLaunchELF",     sub:"File manager" },
  { name:"PS2 ESR Disc",   sub:"Patched DVD launcher" },
  { name:"uLaunchELF",     sub:"mmce0:/APPS" },
  { name:"FreeMcBoot Cfg", sub:"Memory card tools" },
  { name:"HDLoader",       sub:"—" },
];

// FNT_DEFAULT is 17px; the subtitle slot is a second fntLoadFile(NULL, 12).
const SHELF_FNT = { size: 17, family: "PoeVetica" };
const SHELF_FNT_SM = { size: 12, family: "PoeVetica" };

function shelfText(x, y, str, colorHex, spec = SHELF_FNT, align = "left", maxW = 0) {
  // fntRenderString takes the TOP of the glyph box, not the baseline --
  // textBaselineOffset adds size-2 for ALIGN_NONE. Without this the previewer
  // draws every hardcoded-page string higher than the console does, which is
  // exactly the class of error it exists to catch.
  y += textBaselineOffset(ALIGN_NONE, spec.size);
  useFont(spec);
  const sx = S.aspect / 4;
  let w = textWidth(str, spec);
  if (maxW && w > maxW) {                      // ellipsize exactly as C would
    let cut = str;
    while (cut.length > 1 && textWidth(cut + "…", spec) > maxW) cut = cut.slice(0, -1);
    str = cut + "…"; w = textWidth(str, spec);
  }
  if (align === "center") x -= w >> 1;
  else if (align === "right") x -= w;
  ctx.fillStyle = rgbHex(colorHex);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  if (sx !== 1) { ctx.save(); ctx.scale(sx, 1); }
  let pen = x;
  for (const ch of str) { ctx.fillText(ch, pen / sx, y); pen += glyphMetrics(ch, spec).adv; }
  if (sx !== 1) ctx.restore();
  return w;
}

/* ------------------------------------------- SHELF Library (mirrors shelf.c)

   Not a theme page: the SHELF pages are hardcoded C. This mirrors
   shelfRenderLibrary numerically so the layout can be judged before it reaches
   hardware -- the step whose absence produced squashed tiles, an overlapping
   footer and a hero that was never drawn at all.

   Grid constants are read from the loaded theme's ItemsList rather than typed
   in again, so if conf_theme.cfg and shelf.c drift apart this page shows the
   theme's answer and the difference becomes visible instead of silent.
*/
const RAIL_W = 34, CONTENT_X = RAIL_W + 14;
const LIBP = { HERO_H: 196, GRID_Y: 240, FTR_Y: 450, FTR_TEXT: 454 };

/* shelf.c's collapsed rail: brand mark, four destinations, link state. Drawn
   from rectangles in both places, because the shelf pages load no art. */
function shelfRailPv(active) {
  const on = 0xF2F5F8, off = 0x5C6674, iconY = [66, 102, 138, 174];
  const R = (x, y, w, h, c) => { ctx.fillStyle = rgbHex(c); ctx.fillRect(x, y, w, h); };
  R(0, 0, RAIL_W, SCREEN_H, 0x14171C);
  R(RAIL_W, 0, 1, SCREEN_H, 0x2A3038);
  R(9, 14, 17, 17, 0xF2F5F8);
  shelfText(14, 16, "S", 0x14171C, SHELF_FNT_SM);
  iconY.forEach((y, i) => {
    const c = i === active ? on : off;
    if (i === active) R(0, y - 4, 3, 21, on);
    if (i === 0) { for (let k = 0; k < 6; k++) R(17 - k, y + k, 2 + k * 2, 2, c); R(13, y + 6, 10, 7, c); }
    else if (i === 1) { for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) R(10 + k * 5, y + j * 5, 3, 3, c); }
    else if (i === 2) { R(11, y, 13, 2, c); R(11, y + 11, 13, 2, c); R(11, y, 2, 13, c); R(22, y, 2, 13, c); R(16, y + 2, 2, 9, c); }
    else { R(14, y + 1, 7, 2, c); R(14, y + 10, 7, 2, c); R(12, y + 3, 2, 7, c); R(21, y + 3, 2, 7, c); R(16, y + 5, 3, 3, c); }
  });
  R(15, 440, 5, 5, 0x64C878);
}

function libGridConst() {
  const il = (S.theme?.chains?.main || []).find(e => e.extended && e.extended.columns);
  const x = (il && il.extended) || {};
  return { cols: x.columns || 6, cw: x.cellWidth || 88, ch: x.cellHeight || 136,
           gap: x.gap || 14, lh: x.labelHeight || 11, frame: x.frameSize || 3 };
}

/** shelf.c's shelfHint: a drawn face button and a label. Returns width used. */
function shelfHintPv(x, y, kind, label) {
  const col = { cross: 0x6B99E8, square: 0xD96FBF, circle: 0xE8556B }[kind];
  const cy = y + 8;
  ctx.fillStyle = rgbHex(col);
  if (kind === "square") {
    ctx.fillRect(x, cy - 5, 11, 2); ctx.fillRect(x, cy + 4, 11, 2);
    ctx.fillRect(x, cy - 5, 2, 11); ctx.fillRect(x + 9, cy - 5, 2, 11);
  } else if (kind === "cross") {
    for (let i = 0; i < 11; i++) {
      ctx.fillRect(x + i, cy - 5 + i, 2, 2);
      ctx.fillRect(x + 10 - i, cy - 5 + i, 2, 2);
    }
  } else {
    ctx.beginPath(); ctx.lineWidth = 2; ctx.strokeStyle = rgbHex(col);
    ctx.arc(x + 5.5, cy, 5, 0, Math.PI * 2); ctx.stroke();
  }
  shelfText(x + 18, y, label, 0x8894A2, SHELF_FNT);
  return 18 + textWidth(label, SHELF_FNT) + 22;
}

/* ------------------------------------------------ SHELF Home (mirrors shelf.c)

   The recent list and Playtime are console-side state -- conf_last.cfg and a
   per-game CFG key -- and the previewer has neither. Rather than draw an empty
   page, the first six titles stand in for the recent list and PLAYTIME_MOCK
   supplies minutes.

   Those minutes are chosen to exercise every branch of homeFormatTime: one
   under an hour, several over, and some at zero so the "counted in the
   denominator only" rule is visible. Placeholder data whose shape is wrong is
   worse than none, because the layout then looks fine for values that cannot
   occur.
*/
const PLAYTIME_MOCK = [612, 47, 0, 183, 0, 1240, 0, 95];

function homeFormatTimePv(mins) {
  if (mins <= 0) return "";
  if (mins < 60) return mins + " m";
  return Math.floor(mins / 60) + " h " + (mins % 60) + " m";
}

function renderShelfHome() {
  const M = CONTENT_X, COLW = 184, RX = M + COLW + 12, RW = SCREEN_W - RX - 24;
  const games = gameList();
  const recent = games.slice(0, 8);
  const sel = Math.min(Math.max(S.gameIndex | 0, 0), Math.max(recent.length - 1, 0));
  const R = (x, y, w, h, c) => { ctx.fillStyle = rgbHex(c); ctx.fillRect(x, y, w, h); };
  const card = (x, y, w, h, label) => {
    R(x, y, w, h, 0x161A20); R(x, y, w, 1, 0x2A3038);
    if (label) shelfText(x + 12, y + 10, label, 0x5C6674, SHELF_FNT_SM);
  };
  const fmt = m => m <= 0 ? "" : m < 60 ? m + " m" : Math.floor(m / 60) + " h";

  ctx.save();
  R(0, 0, SCREEN_W, SCREEN_H, 0x0A0C0F);

  // header
  shelfText(M, 14, "HOME", 0x8894A2, SHELF_FNT_SM);
  let rx = SCREEN_W - 24;
  const clock = "21:01";                       // stand-in: the RTC is console-side
  let w = textWidth(clock, SHELF_FNT_SM);
  R(rx - w - 16, 8, w + 16, 20, 0x1C2027);
  shelfText(rx - w - 8, 12, clock, 0xF2F5F8, SHELF_FNT_SM);
  rx -= w + 26;
  w = textWidth("NET", SHELF_FNT_SM);
  R(rx - w - 26, 8, w + 26, 20, 0x1C2027);
  R(rx - w - 18, 16, 5, 5, 0x64C878);
  shelfText(rx - w - 8, 12, "NET", 0x64C878, SHELF_FNT_SM);

  // left column
  card(M, 40, COLW, 108, "CLOCK");
  shelfText(M + 12, 62, "Good evening", 0xF2F5F8, SHELF_FNT_SM);
  shelfText(M + 12, 82, clock, 0xF2F5F8, SHELF_FNT);

  card(M, 156, COLW, 132, "MOST PLAYED");
  const top = PLAYTIME_MOCK.map((m, i) => ({ m, t: (games[i] || {}).title || "" }))
                           .filter(x => x.m > 0).sort((a, b) => b.m - a.m).slice(0, 4);
  top.forEach((e, i) => {
    const y = 182 + i * 28;
    shelfText(M + 12, y, e.t, 0xF2F5F8, SHELF_FNT_SM, "left", COLW - 60);
    const tw = textWidth(fmt(e.m), SHELF_FNT_SM);
    shelfText(M + COLW - 12 - tw, y, fmt(e.m), 0x5C6674, SHELF_FNT_SM);
    R(M + 12, y + 15, COLW - 24, 2, 0x2A3038);
    R(M + 12, y + 15, Math.round((COLW - 24) * e.m / top[0].m), 2, 0x64C878);
  });

  card(M, 296, COLW, 118, "SYSTEM");
  const totalM = PLAYTIME_MOCK.filter(m => m > 0).reduce((a, b) => a + b, 0);
  shelfText(M + 12, 322, `${top.length} of ${games.length} played`, 0x8894A2, SHELF_FNT_SM);
  shelfText(M + 12, 342, `${fmt(totalM)} total`, 0x8894A2, SHELF_FNT_SM);
  shelfText(M + 12, 362, "v1.2.0-Beta-2216", 0x5C6674, SHELF_FNT_SM);

  // right column
  card(RX, 40, RW, 108, "CONTINUE PLAYING");
  if (sel === 0) {
    R(RX, 40, RW, 2, 0xF2F5F8); R(RX, 146, RW, 2, 0xF2F5F8);
    R(RX, 40, 2, 108, 0xF2F5F8); R(RX + RW - 2, 40, 2, 108, 0xF2F5F8);
  }
  const cov = recent[sel] && gameArt(recent[sel].serial, "COVHD");
  if (cov) ctx.drawImage(cov, RX + RW - 66, 52, 42, 84);
  shelfText(RX + 14, 62, (recent[sel] || {}).title || "—", 0xF2F5F8, SHELF_FNT, "left", RW - 90);
  shelfText(RX + 14, 92, `Last played yesterday  ·  ${fmt(PLAYTIME_MOCK[sel] || 0)} total`,
            0x8894A2, SHELF_FNT_SM);
  shelfText(RX + 14, 110, "14 launches", 0x5C6674, SHELF_FNT_SM);
  const lbl = sel === 0 ? "Resume" : "Play";
  const lw = textWidth(lbl, SHELF_FNT_SM);
  R(RX + 14, 126, lw + 22, 18, 0x2E353F);
  R(RX + 20, 132, 6, 6, 0x64C878);
  shelfText(RX + 32, 128, lbl, 0xF2F5F8, SHELF_FNT_SM);

  shelfText(RX, 162, "RECENTLY PLAYED", 0x5C6674, SHELF_FNT_SM);
  const TILES = 4, tw2 = (RW - 3 * 10) / TILES, th2 = Math.round(tw2 * 180 / 418);
  for (let i = 0; i < TILES && i < recent.length; i++) {
    const cx = RX + i * (tw2 + 10);
    const bg = gameArt(recent[i].serial, "BG");
    if (bg) ctx.drawImage(bg, cx, 182, tw2, th2);
    else R(cx, 182, tw2, th2, 0x161A20);
    if (i === sel) {
      R(cx, 182, tw2, 2, 0xF2F5F8); R(cx, 182 + th2 - 2, tw2, 2, 0xF2F5F8);
      R(cx, 182, 2, th2, 0xF2F5F8); R(cx + tw2 - 2, 182, 2, th2, 0xF2F5F8);
    }
    shelfText(cx, 182 + th2 + 6, recent[i].title, i === sel ? 0xF2F5F8 : 0x8894A2,
              SHELF_FNT_SM, "left", tw2);
    const m = PLAYTIME_MOCK[i] || 0;
    shelfText(cx, 182 + th2 + 20, m ? `${i + 1}d ago · ${fmt(m)}` : `${i + 1}d ago`,
              0x5C6674, SHELF_FNT_SM, "left", tw2);
  }

  R(RAIL_W, LIBP.FTR_Y, SCREEN_W - RAIL_W, SCREEN_H - LIBP.FTR_Y, 0x14171C);
  let hx = CONTENT_X;
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "cross", sel === 0 ? "Resume" : "Play");
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "square", "Details");
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "circle", "Back");

  shelfRailPv(0);
  ctx.restore();
  octx.clearRect(0, 0, SCREEN_W, SCREEN_H);
  applyViewport();
}

function renderShelfLibrary() {
  const g = libGridConst();
  const artW = g.cw - g.gap, artH = g.ch - g.gap - g.lh;
  const wide = S.aspect === 3;
  const sc = v => wide ? (v * 3) >> 2 : v;
  const pitchX = sc(g.cw), drawnW = sc(artW);
  const x0 = RAIL_W + (SCREEN_W - RAIL_W - pitchX * g.cols) / 2;
  // gameList() is the previewer's own source of truth -- the same one drawElement
  // uses -- rather than a second list that could disagree with the main page.
  const games = gameList();
  const game = games[S.gameIndex] || {};
  const sel = Math.min(Math.max(S.gameIndex | 0, 0), Math.max(games.length - 1, 0));
  const first = Math.floor(sel / g.cols) * g.cols;

  ctx.save();
  ctx.fillStyle = rgbHex(0x0A0C0F); ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

  const bg = game.serial ? gameArt(game.serial, "BG") : null;
  if (bg) ctx.drawImage(bg, RAIL_W, 0, SCREEN_W - RAIL_W, LIBP.HERO_H);
  else { ctx.fillStyle = rgbHex(0x14171C); ctx.fillRect(RAIL_W, 0, SCREEN_W - RAIL_W, LIBP.HERO_H); }
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = "rgba(10,12,15," + ((4 + i * 7) / 128) + ")";
    ctx.fillRect(RAIL_W, LIBP.HERO_H - 132 + i * 11, SCREEN_W - RAIL_W, 11);
  }

  shelfText(CONTENT_X, 100, game.title || "—", 0xF2F5F8, SHELF_FNT);
  const meta = [gameAttr(game, "genre"), gameAttr(game, "release"),
                gameAttr(game, "developer")].filter(Boolean).join("  ·  ");
  if (meta) shelfText(CONTENT_X, 128, meta, 0x8894A2, SHELF_FNT_SM);

  for (let n = 0; n < g.cols * 2; n++) {
    const cy = LIBP.GRID_Y + Math.floor(n / g.cols) * g.ch;
    if (cy >= LIBP.FTR_Y) break;
    const idx = first + n;
    if (idx >= games.length) break;
    const cx = x0 + (n % g.cols) * pitchX;
    const cov = gameArt(games[idx].serial, "COV");
    if (cov) ctx.drawImage(cov, cx, cy, drawnW, artH);
    else { ctx.fillStyle = rgbHex(0x14171C); ctx.fillRect(cx, cy, drawnW, artH); }
    if (idx === sel) {
      ctx.fillStyle = rgbHex(0xF2F5F8);
      ctx.fillRect(cx, cy, drawnW, g.frame);
      ctx.fillRect(cx, cy + artH - g.frame, drawnW, g.frame);
      ctx.fillRect(cx, cy, g.frame, artH);
      ctx.fillRect(cx + drawnW - g.frame, cy, g.frame, artH);
    }
    if (cy + artH + g.lh <= LIBP.FTR_Y)
      shelfText(cx, cy + artH, games[idx].title, idx === sel ? 0xF2F5F8 : 0x8894A2,
                SHELF_FNT_SM, "left", drawnW);
  }

  /* Drawn last, so the bottom row runs under it rather than being squashed. */
  ctx.fillStyle = rgbHex(0x14171C);
  ctx.fillRect(RAIL_W, LIBP.FTR_Y, SCREEN_W - RAIL_W, SCREEN_H - LIBP.FTR_Y);
  let hx = CONTENT_X;
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "cross", "Play");
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "square", "Details");
  hx += shelfHintPv(hx, LIBP.FTR_TEXT, "circle", "Back");
  const count = (sel + 1) + " of " + games.length;
  const cw = textWidth(count, SHELF_FNT_SM);
  if (605 - cw > hx + 8)
    shelfText(605 - cw, LIBP.FTR_TEXT, count, 0x8894A2, SHELF_FNT_SM);

  shelfRailPv(1);
  ctx.restore();
  octx.clearRect(0, 0, SCREEN_W, SCREEN_H);
  applyViewport();
}

function renderShelfApps() {
  const sel = S.shelfSel | 0;
  ctx.save();
  ctx.fillStyle = rgbHex(SHELF_PAL.pageBg); ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

  /* top status bar */
  ctx.fillStyle = rgbHex(SHELF_PAL.barBg); ctx.fillRect(0, 0, SCREEN_W, 40);
  ctx.fillStyle = rgbHex(SHELF_PAL.rule);  ctx.fillRect(0, 40, SCREEN_W, 1);
  shelfText(32, 27, "Apps", SHELF_PAL.text);

  // Right cluster, laid out right-to-left so nothing needs measuring twice.
  let rx = 608;
  rx -= shelfText(rx, 26, "12:04", SHELF_PAL.text, SHELF_FNT, "right");   // placeholder
  rx -= 22;
  // Free space is drawn as an em-dash because no free-space query exists for
  // this device class -- see the Phase 5 doc. The slot is real; the value is not.
  rx -= shelfText(rx, 26, "— free", SHELF_PAL.muted, SHELF_FNT, "right");
  rx -= 22;
  const online = true;
  shelfText(rx, 26, "NET", online ? SHELF_PAL.net : SHELF_PAL.netOff, SHELF_FNT, "right");
  ctx.beginPath();
  ctx.arc(rx - textWidth("NET", SHELF_FNT) * (S.aspect / 4) - 12, 21, 4, 0, Math.PI * 2);
  ctx.fillStyle = rgbHex(online ? SHELF_PAL.net : SHELF_PAL.netOff); ctx.fill();

  /* card grid: 3 x 2, 32px margins, 16px gutters */
  const M = 32, GAP = 16, COLS = 3;
  const CW = ((SCREEN_W - 2 * M) - (COLS - 1) * GAP) / COLS;   // 176
  const CH = 170, Y0 = 64;      // two rows reach y=420, just above the footer rule
  for (let i = 0; i < SHELF_APPS_MOCK.length; i++) {
    const a = SHELF_APPS_MOCK[i];
    const cx = M + (i % COLS) * (CW + GAP);
    const cy = Y0 + Math.floor(i / COLS) * (CH + GAP);
    const on = i === sel;

    ctx.fillStyle = rgbHex(on ? SHELF_PAL.cardSel : SHELF_PAL.card);
    ctx.fillRect(cx, cy, CW, CH);
    ctx.strokeStyle = rgbHex(on ? SHELF_PAL.sel : SHELF_PAL.cardEdge);
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(cx + 0.5, cy + 0.5, CW - 1, CH - 1);

    // icon: 56x56 placeholder. Real icons come from appGetIconId / the theme's
    // apps chain; nothing here budgets VRAM because the placeholder is a quad.
    const is = 88, ix = cx + (CW - is) / 2, iy = cy + 20;
    ctx.fillStyle = rgbHex(SHELF_PAL.icon); ctx.fillRect(ix, iy, is, is);
    shelfText(cx + CW / 2, iy + 53, a.name.slice(0, 1), SHELF_PAL.muted, SHELF_FNT, "center");

    shelfText(cx + CW / 2, cy + 134, a.name, SHELF_PAL.text, SHELF_FNT, "center", CW - 16);
    shelfText(cx + CW / 2, cy + 154, a.sub, SHELF_PAL.muted, SHELF_FNT_SM, "center", CW - 16);
  }

  /* footer hints */
  ctx.fillStyle = rgbHex(SHELF_PAL.rule); ctx.fillRect(M, 438, SCREEN_W - 2 * M, 1);
  shelfText(M, 458, "✕  Launch", SHELF_PAL.muted);
  shelfText(M + 110, 458, "○  Back", SHELF_PAL.muted);
  ctx.restore();
  octx.clearRect(0, 0, SCREEN_W, SCREEN_H);
  applyViewport();
}

function render() {
  if (S.chain === "shelfApps") return renderShelfApps();
  if (S.chain === "shelfLibrary") return renderShelfLibrary();
  if (S.chain === "shelfHome") return renderShelfHome();
  if (!S.theme) { ctx.clearRect(0, 0, SCREEN_W, SCREEN_H); octx.clearRect(0, 0, SCREEN_W, SCREEN_H); return; }
  ctx.save();
  ctx.clearRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const chain = S.theme.chains[S.chain] || [];
  for (const el of chain) drawElement(el);      // list order = numbered order (§2.4)
  if (S.showLoading && S.theme.loadingIcon) drawElement(S.theme.loadingIcon);
  ctx.restore();
  drawOverlayLayer(chain);
  applyViewport();
}

function drawOverlayLayer(chain) {
  octx.clearRect(0, 0, SCREEN_W, SCREEN_H);
  if (S.grid) {
    octx.strokeStyle = "#ffffff14"; octx.lineWidth = 1;
    octx.beginPath();
    for (let x = 0; x <= SCREEN_W; x += 8) { octx.moveTo(x + .5, 0); octx.lineTo(x + .5, SCREEN_H); }
    for (let y = 0; y <= SCREEN_H; y += 8) { octx.moveTo(0, y + .5); octx.lineTo(SCREEN_W, y + .5); }
    octx.stroke();
  }
  const el = S.sel;
  if (!el || !el._rect || !chain.includes(el)) return;
  const r = el._rect;
  octx.strokeStyle = "#00aeff"; octx.lineWidth = 1;
  octx.setLineDash([4, 3]);
  octx.strokeRect(r.x + .5, r.y + .5, Math.max(1, r.w) - 1, Math.max(1, r.h) - 1);
  octx.setLineDash([]);
  octx.fillStyle = "#00aeff";
  for (const [hx, hy] of handlePoints(r)) octx.fillRect(hx - 2, hy - 2, 5, 5);
  const tag = `${el.name} · ${el.typeName}`;
  octx.font = "10px system-ui,sans-serif";
  const tw = octx.measureText(tag).width + 8;
  const ty = r.y > 14 ? r.y - 13 : r.y + Math.max(1, r.h) + 1;
  octx.fillStyle = "#00aeffdd";
  octx.fillRect(r.x, ty, tw, 12);
  octx.fillStyle = "#04121c";
  octx.fillText(tag, r.x + 4, ty + 9);
}
const handlePoints = r => [
  [r.x, r.y], [r.x + r.w / 2, r.y], [r.x + r.w, r.y],
  [r.x, r.y + r.h / 2], [r.x + r.w, r.y + r.h / 2],
  [r.x, r.y + r.h], [r.x + r.w / 2, r.y + r.h], [r.x + r.w, r.y + r.h]];

/** Present the 640x480 buffer: zoom, smoothing, and the 16:9 stretch. */
function applyViewport() {
  const stack = document.getElementById("stack");
  const stage = document.getElementById("stage");
  const wide = S.aspect === 3;
  let scale;
  if (S.zoom === "fit") {
    const pad = 24;
    scale = Math.min((stage.clientWidth - pad) / (wide ? SCREEN_W * 4 / 3 : SCREEN_W),
                     (stage.clientHeight - pad) / SCREEN_H);
    scale = Math.max(0.2, scale);
  } else scale = Number(S.zoom);
  const w = Math.round(SCREEN_W * scale * (wide ? 4 / 3 : 1));
  const h = Math.round(SCREEN_H * scale);
  stack.style.width = w + "px";
  stack.style.height = h + "px";
  for (const c of stack.querySelectorAll("canvas"))
    c.style.imageRendering = S.smooth ? "auto" : "pixelated";
  S.viewScaleX = w / SCREEN_W;
  S.viewScaleY = h / SCREEN_H;
}

/* =============================================================== 8. editor */

/** Screen-space point → virtual 640x480 coordinates. */
function toVirtual(ev) {
  const r = cOverlay.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / (r.width / SCREEN_W),
           y: (ev.clientY - r.top) / (r.height / SCREEN_H) };
}

function hitTest(pt) {
  const chain = S.theme ? (S.theme.chains[S.chain] || []) : [];
  for (let i = chain.length - 1; i >= 0; i--) {          // topmost first
    const el = chain[i], r = el._rect;
    if (!r || r.w <= 0 || r.h <= 0) continue;
    if (el.internal === "Background" && i === 0 && chain.length > 1) continue;  // don't swallow clicks
    if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) return el;
  }
  return chain[0] && chain[0].internal === "Background" ? chain[0] : null;
}

function select(el) {
  S.sel = el;
  renderInspector();
  renderTree();
  render();
}

/* ------------------------------------------------------------- coordinate edits */

/**
 * Write a new resolved position back to the cfg, keeping the author's
 * right/bottom-relative convention when they used one (§6.1).
 */
function writePos(el, key, resolved) {
  const wasNeg = (key === "x" ? el.rawX : el.rawY) < 0;
  const raw = wasNeg ? resolved - (key === "x" ? SCREEN_W : SCREEN_H) : resolved;
  setKeyUndoable(el.name + "_" + key, String(raw));
}

let dragState = null;
cOverlay.addEventListener("pointerdown", ev => {
  if (!S.theme) return;
  cOverlay.focus();
  const pt = toVirtual(ev);
  const el = S.sel;
  let mode = "move", handle = null;
  if (el && el._rect && (S.theme.chains[S.chain] || []).includes(el)) {
    const hs = handlePoints(el._rect);
    for (let i = 0; i < hs.length; i++) {
      if (Math.abs(pt.x - hs[i][0]) <= 4 && Math.abs(pt.y - hs[i][1]) <= 4) { mode = "resize"; handle = i; break; }
    }
  }
  if (mode === "move") {
    const hit = hitTest(pt);
    if (hit !== S.sel) select(hit);
    if (!S.sel) return;
    if (S.sel.internal === "ItemsList" && S.sel._cells) {
      const cell = S.sel._cells.find(c => pt.x >= c.x && pt.x <= c.x + c.w && pt.y >= c.y && pt.y <= c.y + c.h);
      if (cell) { S.gameIndex = cell.index; renderGames(); render(); }
    } else if (S.sel.internal === "ItemsList" && S.sel._rows) {
      const row = Math.floor((pt.y - S.sel._rows.top) / MENU_ITEM_HEIGHT);
      if (row >= 0 && row < S.sel._rows.count) { S.gameIndex = S.pageStart + row; renderGames(); render(); }
    }
  }
  if (!S.sel || S.sel.injected) { if (S.sel && S.sel.injected) setStatus("Injected defaults aren't in the file yet — set a value in the inspector to create it."); return; }
  dragState = { mode, handle, startPt: pt, startX: S.sel.posX, startY: S.sel.posY,
                startW: S.sel.width, startH: S.sel.height, el: S.sel, moved: false };
  cOverlay.setPointerCapture(ev.pointerId);
});

cOverlay.addEventListener("pointermove", ev => {
  if (!dragState) {
    if (!S.theme) return;
    const pt = toVirtual(ev);
    let cur = "default";
    const el = S.sel;
    if (el && el._rect && (S.theme.chains[S.chain] || []).includes(el)) {
      const hs = handlePoints(el._rect);
      const CURS = ["nwse-resize","ns-resize","nesw-resize","ew-resize","ew-resize","nesw-resize","ns-resize","nwse-resize"];
      for (let i = 0; i < hs.length; i++)
        if (Math.abs(pt.x - hs[i][0]) <= 4 && Math.abs(pt.y - hs[i][1]) <= 4) { cur = CURS[i]; break; }
    }
    if (cur === "default" && hitTest(pt)) cur = "move";
    cOverlay.style.cursor = cur;
    return;
  }
  const pt = toVirtual(ev);
  let dx = Math.round(pt.x - dragState.startPt.x), dy = Math.round(pt.y - dragState.startPt.y);
  if (ev.altKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
  if (!dragState.moved && Math.abs(dx) + Math.abs(dy) < 2) return;
  dragState.moved = true;
  const el = dragState.el;
  const snap = v => S.snap ? Math.round(v / 8) * 8 : v;

  if (dragState.mode === "move") {
    writePos(el, "x", snap(dragState.startX + dx));
    writePos(el, "y", snap(dragState.startY + dy));
  } else {
    const h = dragState.handle;
    const w0 = dragState.startW === DIM_UNDEF ? Math.round(el._rect.w) : dragState.startW;
    const h0 = dragState.startH === DIM_UNDEF ? Math.round(el._rect.h) : dragState.startH;
    const left = [0,3,5].includes(h), right = [2,4,7].includes(h);
    const topH = [0,1,2].includes(h), bot = [5,6,7].includes(h);
    if (right) setKeyUndoable(el.name + "_width", String(Math.max(0, snap(w0 + dx))));
    if (left)  { setKeyUndoable(el.name + "_width", String(Math.max(0, snap(w0 - dx)))); writePos(el, "x", snap(dragState.startX + dx)); }
    if (bot)   setKeyUndoable(el.name + "_height", String(Math.max(0, snap(h0 + dy))));
    if (topH)  { setKeyUndoable(el.name + "_height", String(Math.max(0, snap(h0 - dy)))); writePos(el, "y", snap(dragState.startY + dy)); }
  }
  rebuild({ keepSelection: el.name });
}, { passive: true });

addEventListener("pointerup", () => {
  if (dragState && dragState.moved) commitUndo();
  dragState = null;
});

cOverlay.addEventListener("keydown", ev => {
  if (!S.sel || S.sel.injected) return;
  const step = ev.shiftKey ? 8 : 1;
  const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
  if (map[ev.key]) {
    ev.preventDefault();
    pushUndo();
    writePos(S.sel, "x", S.sel.posX + map[ev.key][0]);
    writePos(S.sel, "y", S.sel.posY + map[ev.key][1]);
    rebuild({ keepSelection: S.sel.name });
    commitUndo();
  } else if (ev.key === "Tab") {
    ev.preventDefault();
    const chain = S.theme.chains[S.chain] || [];
    const i = chain.indexOf(S.sel);
    select(chain[(i + (ev.shiftKey ? -1 : 1) + chain.length) % chain.length]);
  } else if (ev.key === "Escape") select(null);
});

/* ---------------------------------------------------------------- undo */

let undoPending = null;
function pushUndo() { if (!undoPending && S.doc) undoPending = writeConfig(S.doc); }
function commitUndo() {
  if (!undoPending) return;
  const now = writeConfig(S.doc);
  if (now !== undoPending) { S.undo.push(undoPending); S.redo.length = 0; if (S.undo.length > 200) S.undo.shift(); }
  undoPending = null;
}
function setKeyUndoable(key, value) { pushUndo(); setKey(S.doc, key, value); }
function deleteKeyUndoable(key) { pushUndo(); deleteKey(S.doc, key); }

addEventListener("keydown", ev => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (!mod || ev.key.toLowerCase() !== "z") return;
  if (document.activeElement === document.getElementById("cfg")) return;   // let the textarea undo itself
  ev.preventDefault();
  const stack = ev.shiftKey ? S.redo : S.undo, other = ev.shiftKey ? S.undo : S.redo;
  if (!stack.length) return;
  other.push(writeConfig(S.doc));
  loadCfgText(stack.pop(), { keepSelection: S.sel && S.sel.name });
});

/* ------------------------------------------------------------ inspector */

const ATTR_META = {
  x:{kind:"pos"}, y:{kind:"pos"}, width:{kind:"dim"}, height:{kind:"dim"},
  aligned:{kind:"enum", options:[["0","0 — x,y is the top-left"],["1","1 — x,y is the centre"]]},
  scaled:{kind:"enum", options:[["0","0 — stretch in widescreen"],["1","1 — keep aspect in widescreen"]]},
  enabled:{kind:"enum", options:[["1","1 — drawn"],["0","0 — skipped, numbering continues"]]},
  color:{kind:"color"}, font:{kind:"int"}, count:{kind:"int"},
  display:{kind:"enum", options:[["0","0 — label always"],["1","1 — label when defined"],["2","2 — value only"]]},
  wrap:{kind:"enum", options:[["0","0 — no wrap"],["1","1 — word wrap"]]},
  type:{kind:"type"},
};
const OVERLAY_SET = new Set(OVERLAY_ATTRS);

function renderInspector() {
  const host = document.getElementById("insp");
  const el = S.sel;
  if (!el) { host.innerHTML = '<div class="empty">Select an element on the canvas or in the list.</div>'; return; }
  host.innerHTML = "";

  const head = document.createElement("div");
  head.className = "hint";
  head.innerHTML = `<b style="color:var(--fg)">${el.name}</b> — ${el.typeName}` +
    (el.internal !== el.typeName ? ` <span title="OPL builds this as ${el.internal} internally">(built as ${el.internal})</span>` : "") +
    (el.injected ? `<br>Injected by OPL because the theme didn't declare one. Setting any value here writes it into the file.` : "") +
    (el.inheritedFrom ? `<br>Inherited from <b>${el.inheritedFrom}</b>. Editing writes to ${el.inheritedFrom}, which also changes the main page — add an <code>${el.name}_type</code> block to override just this page.` : "") +
    (el.missing ? `<br><span style="color:var(--err)">No ${el.name}_${el.missing}, so OPL never draws this.</span>` : "") +
    `<br>resolved: x=${el.posX} y=${el.posY} w=${el.width === DIM_UNDEF ? "texture" : el.width} h=${el.height === DIM_UNDEF ? "texture" : el.height}`;
  host.appendChild(head);

  const used = [...COMMON_ATTRS.filter(a => a !== "type"), ...(TYPE_ATTRS[el.typeName] || [])];
  const shownOverlay = el.extended && el.extended.overlay;
  for (const attr of used) {
    if (OVERLAY_SET.has(attr) && attr !== "overlay" && !shownOverlay) continue;
    host.appendChild(attrRow(el, attr));
  }

  const unused = [...el.explicit].filter(k => !used.includes(k) && k !== "type");
  if (unused.length) {
    const d = document.createElement("details");
    d.className = "grp";
    d.innerHTML = `<summary>Not used by ${el.typeName} (${unused.length})</summary>`;
    for (const attr of unused) d.appendChild(attrRow(el, attr, true));
    host.appendChild(d);
  }
}

function effectiveValue(el, attr) {
  const raw = getStr(S.doc, el.name + "_" + attr);
  if (raw !== null) return { raw, explicit: true };
  const ex = el.extended || {};
  const shown = {
    x: String(el.rawX), y: String(el.rawY),
    width: el.width === DIM_UNDEF ? "-1" : String(el.width),
    height: el.height === DIM_UNDEF ? "-1" : String(el.height),
    aligned: el.aligned === ALIGN_CENTER ? "1" : "0",
    scaled: el.scaled === SCALING_RATIO ? "1" : "0",
    enabled: "1", color: colorToHex(el.color), font: String(el.font),
    pattern: ex.pattern ?? "", count: String(ex.count ?? ""), default: ex.defaultTexture ?? "",
    overlay: ex.overlay ?? "", decorator: ex.decorator ?? "",
    value: ex.value ?? "", attribute: ex.value ?? "", title: "",
    display: String(ex.displayMode ?? 0), wrap: ex.sizingMode === SIZING_WRAP ? "1" : "0",
  };
  if (OVERLAY_SET.has(attr) && ex.overlayRect) shown[attr] = String(ex.overlayRect[attr.slice(8)] ?? 0);
  return { raw: shown[attr] ?? "", explicit: false };
}

function attrRow(el, attr, greyed) {
  const { raw, explicit } = effectiveValue(el, attr);
  const meta = ATTR_META[attr] || { kind: "text" };
  const row = document.createElement("div");
  row.className = "row" + (explicit ? "" : " def");
  const label = document.createElement("label");
  label.textContent = attr;
  label.title = explicit ? `${el.name}_${attr} is set in the file` : "using the type default";
  row.appendChild(label);

  let input;
  const commit = v => {
    pushUndo();
    if (v === "" && explicit) deleteKey(S.doc, el.name + "_" + attr);
    else setKey(S.doc, el.name + "_" + attr, v);
    commitUndo();
    rebuild({ keepSelection: el.name });
  };

  if (meta.kind === "enum") {
    input = document.createElement("select");
    for (const [v, text] of meta.options) {
      const o = document.createElement("option");
      o.value = v; o.textContent = text; input.appendChild(o);
    }
    input.value = String(atoi(raw));
    input.onchange = () => commit(input.value);
  } else if (meta.kind === "color") {
    const wrap = document.createElement("div");
    wrap.className = "swatch";
    const parsed = parseColor(raw);
    const pick = document.createElement("input");
    pick.type = "color"; pick.value = colorToHex(parsed);
    const text = document.createElement("input");
    text.type = "text"; text.value = raw; text.style.flex = "1";
    pick.oninput = () => { text.value = pick.value; commit(pick.value); };
    text.onchange = () => commit(text.value);
    wrap.append(pick, text);
    input = wrap;
  } else {
    input = document.createElement("input");
    input.type = "text";
    input.value = raw;
    input.placeholder = meta.kind === "pos" ? "number or POS_MID"
                      : meta.kind === "dim" ? "number, -1 or DIM_INF" : "";
    input.onchange = () => commit(input.value.trim());
  }
  if (greyed) input.style.opacity = ".6";
  row.appendChild(input);

  const rst = document.createElement("button");
  rst.className = "rst"; rst.textContent = "reset"; rst.title = "remove this line from the file";
  rst.onclick = () => { pushUndo(); deleteKey(S.doc, el.name + "_" + attr); commitUndo(); rebuild({ keepSelection: el.name }); };
  row.appendChild(rst);
  return row;
}

/* ------------------------------------------------------- tree / diagnostics */

function renderTabs() {
  const host = document.getElementById("tabs");
  host.innerHTML = "";
  const labels = { main:"Main", info:"Info", appsMain:"Apps main", appsInfo:"Apps info",
                   shelfApps:"SHELF Apps", shelfLibrary:"SHELF Library",
                   shelfHome:"SHELF Home" };
  for (const key of ["main","info","appsMain","appsInfo","shelfHome","shelfLibrary","shelfApps"]) {
    const mock = key.startsWith("shelf");   // hardcoded C pages
    const n = S.theme ? (S.theme.chains[key] || []).length : 0;
    const b = document.createElement("button");
    b.textContent = mock ? `${labels[key]} (mock)` : `${labels[key]} (${n})`;
    b.className = S.chain === key ? "on" : "";
    b.disabled = !mock && n === 0 && key !== "main";
    b.onclick = () => { S.chain = key; S.sel = null; renderTabs(); renderTree(); renderInspector(); render(); };
    host.appendChild(b);
  }
}

function renderTree() {
  const host = document.getElementById("tree");
  host.innerHTML = "";
  const chain = S.theme ? (S.theme.chains[S.chain] || []) : [];
  if (!chain.length) { host.innerHTML = '<div class="empty">Nothing on this page.</div>'; return; }
  const byEl = new Map();
  for (const d of allDiags()) if (d.element) {
    const cur = byEl.get(d.element);
    if (!cur || (cur !== "error" && d.severity === "error")) byEl.set(d.element, d.severity);
  }
  chain.forEach((el, i) => {
    const row = document.createElement("div");
    row.className = "el" + (el === S.sel ? " sel" : "") + (el.injected || !el.drawable ? " ghost" : "");
    const sev = byEl.get(el.name);
    row.innerHTML = `<span class="n">${String(i).padStart(2, " ")}</span> ${el.name} · ${el.typeName}` +
      (el.injected ? ' <span class="b w">injected</span>' : "") +
      (!el.drawable && !el.injected ? ' <span class="b">not drawn</span>' : "") +
      (sev && el.drawable ? ` <span class="b ${sev === "error" ? "" : "w"}">${sev === "error" ? "!" : "?"}</span>` : "");
    row.onclick = () => select(el);
    host.appendChild(row);
  });
}

function renderGames() {
  const host = document.getElementById("games");
  host.innerHTML = "";
  gameList().forEach((g, i) => {
    const row = document.createElement("div");
    row.className = "el" + (i === S.gameIndex ? " sel" : "");
    row.innerHTML = `${g.title}<br><span class="n">${g.serial}</span>`;
    row.onclick = () => { S.gameIndex = i; renderGames(); render(); };
    host.appendChild(row);
  });
}

const allDiags = () => [...(S.theme ? S.theme.diags : []), ...(S.validation ? S.validation.diags : [])];

function renderDiags() {
  const host = document.getElementById("diags");
  host.innerHTML = "";
  const list = allDiags().slice().sort((a, b) => rank(b.severity) - rank(a.severity));
  if (!list.length) { host.innerHTML = '<div class="empty">No problems found.</div>'; return; }
  for (const d of list) {
    const row = document.createElement("div");
    row.className = "d " + d.severity;
    row.innerHTML = `<span class="ic">${d.severity === "error" ? "ERR" : d.severity === "warn" ? "WARN" : "INFO"}</span>` +
      `<span>${escapeHtml(d.message)}<code>${d.code}${d.line ? " · line " + d.line : ""}</code></span>`;
    row.onclick = () => {
      if (d.line) gotoLine(d.line);
      if (d.element) {
        for (const key of ["main","info","appsMain","appsInfo"]) {
          const el = (S.theme.chains[key] || []).find(e => e.name === d.element);
          if (el) { S.chain = key; renderTabs(); select(el); break; }
        }
      }
    };
    host.appendChild(row);
  }
}
const rank = s => s === "error" ? 2 : s === "warn" ? 1 : 0;
const escapeHtml = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

function renderMemory() {
  const host = document.getElementById("mem");
  const m = S.validation && S.validation.memory;
  if (!m || !m.rows.length) { host.innerHTML = '<div class="empty">No art caches in this theme.</div>'; return; }
  const mb = b => (b / 1048576).toFixed(2) + " MB";
  const v = S.validation.vram;
  const vmb = b => (b / 1048576).toFixed(2) + " MB";
  host.innerHTML =
    (v ? `<table id="memTable"><tr><th>drawn together</th><th>at once</th><th>size</th><th class="n">VRAM</th></tr>` +
      v.rows.map(r => `<tr><td>${r.el} ${r.pattern}</td><td>${r.concurrent}</td>` +
        `<td title="${r.basis}">${r.w}×${r.h}${r.basis === "measured" ? "" : "?"}</td>` +
        `<td class="n">${vmb(r.bytes)}</td></tr>`).join("") +
      `<tr><td colspan="3"><b>VRAM peak (${v.chain})</b></td><td class="n mem-${v.level}"><b>${vmb(v.total)}</b></td></tr>` +
      `<tr><td colspan="3">budget</td><td class="n">${vmb(v.budget)}</td></tr></table>` +
      `<div class="hint" style="padding:6px 9px 10px">Textures resident in one frame, at <b>source</b> size × 4 bytes. ` +
      `gsKit gets 4 MB; two 640×480 CT24 buffers leave about 1.66 MB. ` +
      (v.level === "err" ? `<span style="color:var(--err)">Over budget — the texture manager will evict and re-upload every frame. Shrink the art files.</span>`
       : v.level === "warn" ? `<span style="color:var(--warn)">Close to the limit.</span>` : `Fits.`) + `</div>` : "") +
    `<table id="memTable"><tr><th>pattern</th><th>count</th><th>size</th><th class="n">EE RAM</th></tr>` +
    m.rows.map(r => `<tr><td>${r.pattern}${r.shared ? " ×" + r.users.length : ""}</td><td>${r.count}</td>` +
      `<td title="${r.basis}">${r.w}×${r.h}</td><td class="n">${mb(r.bytes)}</td></tr>`).join("") +
    `<tr><td colspan="3"><b>total</b></td><td class="n mem-${m.level}"><b>${mb(m.total)}</b></td></tr></table>` +
    `<div class="hint" style="padding:6px 9px 10px">count × <b>source</b> width × height × 3 bytes, decoded and held resident. ` +
    `The element's drawn size does not reduce this. Shared patterns counted once. ` +
    (m.level === "err" ? `<span style="color:var(--err)">This is very likely to exhaust a 32 MB console even though it will look fine in PCSX2.</span>`
     : m.level === "warn" ? `<span style="color:var(--warn)">Getting heavy for a 32 MB console — test on hardware.</span>`
     : `Comfortable for a 32 MB console.`) + `</div>`;
}

/* -------------------------------------------------------------- cfg pane */

const cfgEl = document.getElementById("cfg");
let cfgTimer = null;
cfgEl.addEventListener("input", () => {
  if (S.syncing) return;
  S.typing = Date.now();
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => {
    S.undo.push(S.doc ? writeConfig(S.doc) : "");
    S.redo.length = 0;
    loadCfgText(cfgEl.value, { fromPane: true, keepSelection: S.sel && S.sel.name });
  }, 250);
});

function gotoLine(n) {
  const lines = cfgEl.value.split("\n");
  let pos = 0;
  for (let i = 0; i < n - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  cfgEl.focus();
  cfgEl.setSelectionRange(pos, pos + (lines[n - 1] || "").length);
  const lineH = 11.5 * 1.45;
  cfgEl.scrollTop = Math.max(0, (n - 4) * lineH);
}

/* ---------------------------------------------------------- build + sync */

function rebuild(opts = {}) {
  S.theme = buildTheme(S.doc);
  S.validation = validateTheme(S.doc, S.theme, (S.files.size || S.art.size) ? assetIndex() : null);
  if (opts.keepSelection) {
    let found = null;
    for (const key of ["main","info","appsMain","appsInfo"])
      for (const el of S.theme.chains[key] || []) if (el.name === opts.keepSelection && (!found || key === S.chain)) found = el;
    S.sel = found;
  } else if (S.sel) S.sel = null;

  if (!opts.fromPane) {
    const text = writeConfig(S.doc);
    if (cfgEl.value !== text) {
      // Don't clobber the buffer mid-keystroke; the debounce will reconcile.
      if (document.activeElement !== cfgEl || Date.now() - S.typing > 800) {
        S.syncing = true;
        const { selectionStart: a, selectionEnd: b, scrollTop } = cfgEl;
        cfgEl.value = text;
        try { cfgEl.setSelectionRange(a, b); } catch {}
        cfgEl.scrollTop = scrollTop;
        S.syncing = false;
      }
    }
  }
  renderTabs(); renderTree(); renderInspector(); renderDiags(); renderMemory(); render();
}

function loadCfgText(text, opts = {}) {
  S.doc = parseConfig(text);
  if (!opts.fromPane) {
    S.syncing = true; cfgEl.value = text; S.syncing = false;
  }
  const mockTab = S.chain.startsWith("shelf");   // no chain; the guards below would evict them
  if (!mockTab && !(S.theme && S.theme.chains[S.chain])) S.chain = "main";
  rebuild(opts);
  if (!mockTab && (!S.theme.chains[S.chain] || !S.theme.chains[S.chain].length)) S.chain = "main";
}

/* ================================================================= 9. app */

const setStatus = (msg) => {
  const el = document.getElementById("status");
  el.textContent = msg || "";
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 6000);
};

async function adoptFiles(files) {
  const cfg = await ingestFiles(files);
  if (cfg === null) {
    await applyThemeFonts();
    setStatus("No conf_theme.cfg in that folder — assets loaded, cfg unchanged.");
    if (S.doc) rebuild({ keepSelection: S.sel && S.sel.name });
    return;
  }
  S.undo.length = 0; S.redo.length = 0;
  // Parse first: applyThemeFonts reads default_font/fontN out of the *new* cfg.
  S.doc = parseConfig(cfg);
  await applyThemeFonts();
  loadCfgText(cfg);
  setStatus(`Loaded ${S.files.size} files, ${S.images.size} images${S.art.size ? ", " + S.art.size + " art files" : ""}.`);
}

/** Register the theme's own TTFs so `font=N` previews with the right face. */
async function applyThemeFonts() {
  S.themeFonts = new Map();
  if (!S.doc) return;
  const probe = buildTheme(S.doc);
  for (let i = 0; i < 16; i++) {
    const f = probe.fonts[i];
    if (!f || !f.file) continue;
    const file = S.files.get(lower(f.file));
    if (!file) continue;
    const family = "ThemeFont" + i;
    if (await loadThemeFont(file, family)) S.themeFonts.set(i, family);
  }
  glyphCache.clear();
}

document.getElementById("btnFolder").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.webkitdirectory = true; inp.multiple = true;
  inp.onchange = () => adoptFiles([...inp.files]);
  inp.click();
};

document.getElementById("btnArt").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.webkitdirectory = true; inp.multiple = true;
  inp.onchange = async () => {
    let n = 0;
    await Promise.all([...inp.files].filter(f => /\.(png|jpe?g)$/i.test(f.name))
      .map(f => { n++; return loadArt(f.name, f); }));
    const sizes = [...assetIndex().artSize].map(([p, d]) => `${p} ${d.w}×${d.h}`).join(", ");
    setStatus(`Loaded ${n} art files${sizes ? " — " + sizes : ""}`);
    rebuild({ keepSelection: S.sel && S.sel.name });   // re-measure RAM and VRAM
  };
  inp.click();
};

/* File System Access API — live reload (progressive enhancement). */
const btnLive = document.getElementById("btnLive");
if (!window.showDirectoryPicker) { btnLive.disabled = true; btnLive.title = "This browser has no File System Access API — use “Open theme folder…”."; }
btnLive.onclick = async () => {
  if (S.live) { stopLive(); return; }
  try {
    S.dirHandle = await showDirectoryPicker({ mode: "readwrite" });
    await reloadFromHandle(true);
    S.live = true;
    btnLive.classList.add("on");
    document.getElementById("btnSave").disabled = false;
    S.liveTimer = setInterval(() => reloadFromHandle(false), 700);
  } catch { /* user cancelled */ }
};
function stopLive() {
  S.live = false; clearInterval(S.liveTimer);
  btnLive.classList.remove("on");
  setStatus("Live reload off.");
}
let liveStamps = new Map();
async function reloadFromHandle(initial) {
  if (!S.dirHandle) return;
  try {
    const files = [], stamps = new Map();
    for await (const [name, h] of S.dirHandle.entries()) {
      if (h.kind !== "file") continue;
      const f = await h.getFile();
      files.push(f); stamps.set(name, f.lastModified + ":" + f.size);
    }
    let changed = initial;
    if (!changed) {
      if (stamps.size !== liveStamps.size) changed = true;
      else for (const [k, v] of stamps) if (liveStamps.get(k) !== v) { changed = true; break; }
    }
    liveStamps = stamps;
    if (!changed) return;
    const keep = S.sel && S.sel.name, chain = S.chain;
    await adoptFiles(files);
    S.chain = chain;
    rebuild({ keepSelection: keep });
    if (!initial) setStatus("Reloaded " + new Date().toLocaleTimeString());
  } catch (e) { stopLive(); setStatus("Live reload stopped: " + e.message); }
}

document.getElementById("btnSave").onclick = async () => {
  if (!S.dirHandle || !S.doc) return;
  try {
    const h = await S.dirHandle.getFileHandle("conf_theme.cfg", { create: true });
    const w = await h.createWritable();
    await w.write(writeConfig(S.doc));
    await w.close();
    liveStamps = new Map();       // don't treat our own write as an external change
    setStatus("Saved conf_theme.cfg");
  } catch (e) { setStatus("Save failed: " + e.message); }
};

document.getElementById("btnExport").onclick = () => {
  if (!S.doc) { setStatus("Nothing to export yet."); return; }
  const text = writeConfig(S.doc);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = "conf_theme.cfg";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* Drag and drop a folder. */
const dropEl = document.getElementById("drop");
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add("on"); });
addEventListener("dragover", e => e.preventDefault());
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("on"); } });
addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove("on");
  const files = [];
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const f = await new Promise(r => entry.file(r));
      Object.defineProperty(f, "webkitRelativePath", { value: path + f.name });
      files.push(f);
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise(r => reader.readEntries(r));
        if (!batch.length) break;
        for (const c of batch) await walk(c, path + entry.name + "/");
      }
    }
  };
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) { for (const en of entries) await walk(en, ""); await adoptFiles(files); }
  else if (e.dataTransfer.files.length) await adoptFiles([...e.dataTransfer.files]);
});

/* Toolbar */
const toggle = (id, get, set) => {
  const b = document.getElementById(id);
  b.onclick = () => { set(!get()); b.classList.toggle("on", get()); render(); };
};
document.getElementById("btn43").onclick = () => {
  S.aspect = 4;
  document.getElementById("btn43").classList.add("on");
  document.getElementById("btn169").classList.remove("on");
  render();
};
document.getElementById("btn169").onclick = () => {
  S.aspect = 3;
  document.getElementById("btn169").classList.add("on");
  document.getElementById("btn43").classList.remove("on");
  render();
};
document.getElementById("zoom").onchange = e => { S.zoom = e.target.value; render(); };

const devSel = document.getElementById("device"), devCount = document.getElementById("devCount");
DEVICES.forEach((d, i) => devSel.add(new Option(d.name, String(i))));
const syncDevices = () => {
  S.deviceCount = Number(devCount.value);
  if (S.device >= S.deviceCount) S.device = S.deviceCount - 1;
  devSel.value = String(S.device);
  [...devSel.options].forEach((o, i) => o.disabled = i >= S.deviceCount);
  render();
};
devSel.onchange = () => { S.device = Number(devSel.value); render(); };
devCount.onchange = syncDevices;

// gAutosort defaults to 1 (opl.c:1739) and sorts with strcasecmp on the display
// text (submenuSort, menusys.c:561). Reproduced so row order matches the console.
document.getElementById("btnLaunch").onclick = () => {
  const g = gameList()[S.gameIndex];
  if (!g) return;
  pushRecent(g.serial);
  setStatus(`Launched ${g.title} — recently-played updated.`);
  render();
};
document.getElementById("sortMode").onchange = e => {
  S.sortMode = Number(e.target.value);
  S.gameIndex = 0; S.pageStart = 0;
  renderGames(); render();
};
toggle("btnSmooth", () => S.smooth, v => S.smooth = v);
toggle("btnGrid", () => S.grid, v => S.grid = v);
toggle("btnSnap", () => S.snap, v => S.snap = v);
toggle("btnPlasma", () => S.plasma, v => { S.plasma = v; plasmaCache = null; });
toggle("btnLoad", () => S.showLoading, v => S.showLoading = v);
document.getElementById("btnBig").onclick = e => {
  document.getElementById("cfgWrap").classList.toggle("big");
  e.target.textContent = document.getElementById("cfgWrap").classList.contains("big") ? "Shrink" : "Expand";
  render();
};
addEventListener("resize", () => { if (S.zoom === "fit") render(); });

/* Boot */
(async () => {
  await loadBuiltinFont();
  if (!fontReady) setStatus("Built-in font not embedded — run tools/embed-font.mjs. Text metrics will be approximate.");
  renderGames();
  renderTabs();
  loadCfgText(
    "# Paste a conf_theme.cfg here, or use “Open theme folder…”.\n" +
    "# With nothing declared, OPL still draws a plasma background and injects\n" +
    "# an ItemsList — which is what you are looking at.\n\n" +
    "bg_color=#28C5F9\n");
})();
</script>
