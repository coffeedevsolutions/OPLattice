# DELIBERATELY BROKEN THEME
# Every element here is wrong on purpose. See README.md in this folder for the
# diagnostic codes the previewer is expected to raise, and why.
#
# Note that no comment in this file contains a colon. To OPL, a line holding a
# colon and no equals sign is a SECTION HEADER even when it starts with a hash,
# so a colon in a comment silently re-homes every key under it.

# 1. no leading hash, so OPL parses this as #000000 (black), not as an error
text_color=FFFFFF
sel_text_color=#0FF
bg_color=#402A2A

main0:
	type=Background
	# 2. extension included, so OPL appends .png and looks for "logo.png.png"
	default=logo.png

main1:
	type=ItemsList
	x=40
	y=48
	width=360
	height=380
	# 3. the decorator target caches fewer images than this list shows rows
	decorator=ICO

main2:
	type=ItemIcon
	x=18
	y=48
	width=20
	height=20
	count=6

main3:
	# 4. a Background anywhere but first is discarded, and the index is still used
	type=Background
	default=backdrop

main4:
	# 5. StaticText with no value, so it is built but never drawn
	type=StaticText
	x=10
	y=200

main5:
	# 6. wrong case, because types are compared with strcmp
	type=itemslist
	x=10
	y=10

main6:
	# 7. a huge cover with a huge cache, about 31 MB on a 32 MB console
	type=ItemCover
	x=-120
	y=-300
	width=512
	height=512
	count=40
	# 8. this asset does not exist in the folder
	default=missing_cover

# 9. main7 has no "type", which ends the scan. Everything below is dead.
main7:
	x=100
	y=100

main8:
	type=StaticText
	value=NEVER RENDERED
	x=30
	y=30

main9:
	type=MenuIcon
	x=320
	y=400

info0:
	type=Background
	pattern=BG

info1:
	type=AttributeText
	attribute=Title
	x=30
	y=30
	# 10. an image-only key on a text element, silently ignored
	pattern=COV
