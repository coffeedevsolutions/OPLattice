# midrange theme -- exercises POS_MID, aligned, negative coords, decorators,
# per-element fonts, overlays and a full info page.
# Written in the PREFIX form (tab-indented), like OPL's own conf_theme_OPL.cfg.

bg_color=#1B2430
text_color=#E8EEF5
ui_text_color=#5868B4
sel_text_color=#5FD3F3
use_default=1

default_font=PoeVeticaNew.ttf
default_font_size=17
font1=PoeVeticaNew.ttf
font1_size=22

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main1:
	type=StaticText
	value=MY LIBRARY
	x=POS_MID
	y=14
	aligned=1
	font=1
	color=#5FD3F3

main2:
	type=ItemIcon
	x=24
	y=64
	width=20
	height=20
	count=24

main3:
	type=ItemsList
	x=52
	y=64
	width=320
	height=304
	decorator=ICO

main4:
	type=ItemCover
	default=cover
	x=-118
	y=-300
	width=150
	height=214
	overlay=case
	overlay_ulx=0
	overlay_uly=8
	overlay_urx=150
	overlay_ury=16
	overlay_llx=0
	overlay_lly=206
	overlay_lrx=150
	overlay_lry=214

main5:
	type=ItemText
	x=-160
	y=-152
	aligned=1

main6:
	type=GameCountText
	x=-24
	y=22
	aligned=0
	color=#8FA3B8

main7:
	type=MenuIcon
	x=POS_MID
	y=404

main8:
	type=HintText
	aligned=1
	x=POS_MID

# The apps page reuses main0-main8 by index, but swaps the header text.
appsMain1:
	type=StaticText
	value=APPLICATIONS
	x=POS_MID
	y=14
	aligned=1
	font=1
	color=#5FD3F3

