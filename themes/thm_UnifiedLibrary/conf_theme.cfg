# Unified Library
#
# One identical layout on every device page, so USB/SD, HDD, Ethernet and Apps
# all look like the same library and L1/R1 only changes the source. Row art via
# the ItemsList decorator, a large cover for the selected game, and a per-game
# backdrop.
#
# Art expected in the device's ART folder, named by serial.
#   <SERIAL>_COV.png   box art, portrait
#   <SERIAL>_ICO.png   64x64 row icon
#   <SERIAL>_BG.png    wallpaper for the selected game
#
# Read README.md in this folder before changing any count or the list height.

bg_color=#141A24
text_color=#B9C6D6
ui_text_color=#E8F1FA
sel_text_color=#5FD3F3
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=24
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12

# --- main0  per-game backdrop -------------------------------------------------
# GameImage rather than StaticImage, so the wallpaper follows the selection.
# Falls back to backdrop.png, then to the plasma, when a game has no _BG art.
main0:
	type=Background
	pattern=BG
	default=backdrop
	count=2
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# --- main1  readability wash --------------------------------------------------
# Drawn before the list so it sits underneath it. Unscaled so it stretches with
# the screen in widescreen, which is what you want for a full-bleed overlay.
main1:
	type=StaticImage
	default=scrim
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# --- main2  device name -------------------------------------------------------
# MenuText is the "one place" affordance. It names the current device and draws
# the left/right arrows that say the other libraries are one press away.
main2:
	type=MenuText
	x=POS_MID
	y=26
	width=210
	height=20
	aligned=1
	font=1
	color=#E8F1FA

main3:
	type=MenuIcon
	x=44
	y=34
	width=30
	height=30
	aligned=1

# Which mass device you are on, when more than one is connected.
main4:
	type=BdmIndex
	x=POS_MID
	y=52
	width=64
	height=8

main5:
	type=GameCountText
	x=-92
	y=28
	aligned=1
	color=#7C8CA2

# --- main6  the big cover -----------------------------------------------------
# Source art is 300x450, so 186x279 keeps that 2-to-3 ratio. count only needs to
# cover a little scroll-ahead, because nothing else shares this pattern.
main6:
	type=ItemCover
	default=cover
	x=-142
	y=-284
	width=186
	height=279
	aligned=1
	count=6

# --- main7  row-icon source ---------------------------------------------------
# Deliberately invisible at 0x0, the same trick OPL's own theme uses for the
# apps page. It exists only to create the ICO cache that main9's decorator
# reuses. Doing it this way, rather than pointing the decorator at COV, is what
# keeps this theme small. Its count must be at or above main9's row count, or
# OPL silently drops the row icons entirely.
main7:
	type=ItemIcon
	width=0
	height=0
	count=16

main8:
	type=ItemText
	x=-142
	y=-112
	aligned=1
	color=#9FB2C8

# --- main9  the library list --------------------------------------------------
# A height of 304 gives 304/19, so 16 rows. That 16 is the number main7's count
# has to match.
main9:
	type=ItemsList
	x=44
	y=86
	width=290
	height=304
	decorator=ICO

main10:
	type=HintText
	x=POS_MID
	aligned=1

# --- apps page ----------------------------------------------------------------
# Every index not overridden below is inherited from its main<N> twin, so the
# Apps page is the same library layout. Only the big cover changes, because
# apps have no COV art, so show the app icon there instead.
appsMain6:
	type=ItemIcon
	x=-142
	y=-296
	width=128
	height=128
	aligned=1
	count=16
