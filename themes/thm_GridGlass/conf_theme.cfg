# Grid / Glass
#
# Flat glass. Translucent panels, hard 1px light borders, square corners, the
# per-game artwork showing through behind everything.
#
# NOTE. True glassmorphism needs a backdrop blur, which means sampling the
# framebuffer as a texture. OPL's renderer has no call for that, so the panels
# are translucent but not blurred. Behind a busy wallpaper that reads as tinted
# acrylic rather than frosted glass.
#
# Needs patches/opl-tile-grid.patch.

bg_color=#0E1420
text_color=#C7D3E2
ui_text_color=#5868B4
sel_text_color=#7CE8FF
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12

# Per-game wallpaper, so the glass has something to sit on.
main0:
	type=Background
	pattern=BG
	count=2
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main1:
	type=StaticImage
	default=dim
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main2:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=56

main3:
	type=MenuText
	x=214
	y=22
	width=120
	height=20
	aligned=0
	color=#8FA3B8

main4:
	type=GameCountText
	x=-90
	y=24
	aligned=1
	color=#8FA3B8

main5:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=10

# Glass slab behind the grid, sized to the grid box so its 1px edge stays 1px.
main6:
	type=StaticImage
	default=panel
	aligned=0
	scaled=0
	x=35
	y=74
	width=570
	height=366

main7:
	type=ItemsList
	x=35
	y=74
	width=570
	height=366
	columns=5
	cell_width=114
	cell_height=183
	gap=14
	text=1
	frame=2
	decorator=COV
	font=2
	label_height=14

main8:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-40
	width=DIM_INF
	height=40

main9:
	type=HintText
	x=POS_MID
	y=-32
	aligned=1

main10:
	type=StaticText
	value=LIBRARY
	x=44
	y=12
	aligned=0
	font=1
	color=#F4FAFF
