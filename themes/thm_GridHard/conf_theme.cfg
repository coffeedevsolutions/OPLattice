# Grid / Hard
#
# Brutalist. Opaque slabs, hard borders, no gradient anywhere, one accent colour
# used only for the selection frame.
#
# Needs patches 01 and 02. On stock OPL the grid keys are ignored, main6 falls
# back to a plain text list, and the RecentImage elements are dropped as unknown
# types.
#
# Widescreen behaviour
#   The bars are unscaled with DIM_INF width, so they stretch edge to edge and
#   their contents spread out with the screen, which is what you want for a
#   full-bleed header and footer.
#   The grid is scaled and left-anchored, so both the tiles and the cell
#   pitch narrow by 3/4 and it stays a centred block at the same proportions.
#   Text never stretches either way -- OPL rasterises glyphs at 3/4 width in
#   anamorphic mode.
#
# Recently played
#   Just the newest launch, in its own band above the grid. The banner is left
#   aligned with the title beside it, and is drawn from the game's _BG art at
#   170x80. Source BG art is 460x215, so those numbers keep its shape.
#
# Button hints
#   circle.png, cross.png, triangle.png, square.png, start.png and select.png in
#   this folder replace OPL's button graphics with plain outlines and bars.
#   Any icon in the BDM_ICON..START_ICON range can be overridden this way, no
#   patch needed. Delete one and OPL falls back to its own, because use_default
#   is 1.
#
# Grid geometry, 5 columns x 2 rows of 79x125 cells
#   art    65 x 97    (2 by 3, matches box art)
#   gap    14
#   label  14         (label_height, tightened for the 12px caption font)

bg_color=#0A0C0F
text_color=#8894A2
ui_text_color=#5868B4
sel_text_color=#FF4D2E
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# --- header -------------------------------------------------------------------
main1:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=52

main2:
	type=StaticText
	value=LIBRARY
	x=35
	y=12
	aligned=0
	font=1
	color=#F2F5F8

main3:
	type=MenuText
	x=205
	y=22
	width=120
	height=20
	aligned=0
	color=#5C6674

main4:
	type=GameCountText
	x=-92
	y=22
	aligned=1
	color=#5C6674

# Invisible, and declared BEFORE anything else that uses COV. findDuplicate
# hands every COV element the first cache created for that pattern, so this one
# has to be first and has to be sized for the 10 grid tiles.
main5:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=10

# --- most recently played -----------------------------------------------------
# One entry, centred. index 0 is the newest launch. It reads OPL's global recent
# list, so it survives switching device -- but art resolves through the CURRENT
# device's ART folder, so a game last played elsewhere falls back to `default`.
main6:
	type=StaticText
	value=CONTINUE
	x=122
	y=60
	aligned=0
	font=2
	color=#5C6674

main7:
	type=RecentImage
	pattern=BG
	default=banner
	x=122
	y=78
	width=170
	height=80
	aligned=0
	count=2

# Sits to the right of the banner, roughly on its vertical centre.
main8:
	type=RecentText
	x=306
	y=108
	width=290
	height=22
	aligned=0
	color=#F2F5F8

# --- the library --------------------------------------------------------------
# Left-anchored rather than centred on POS_MID. A centred grid moves its left
# edge when the tiles narrow in widescreen, and the CONTINUE banner above it is
# an individually placed element that cannot follow. Anchoring both at 122
# keeps them on the same left rule in every aspect. The trade is that in
# widescreen the grid sits slightly left of centre instead of dead centre.
main9:
	type=ItemsList
	x=122
	y=186
	width=395
	height=250
	aligned=0
	columns=5
	cell_width=79
	cell_height=125
	gap=14
	text=1
	frame=3
	decorator=COV
	font=2
	label_height=14

# --- footer -------------------------------------------------------------------
main10:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-40
	width=DIM_INF
	height=40

main11:
	type=HintText
	x=35
	y=-32
	aligned=0
	font=2
	color=#8894A2

# ------------------------------------------------------------------------------
# INFO PAGE  --  press SQUARE on a title
#
# Stock OPL, no patch. itemExecSquare switches to GUI_SCREEN_INFO, but only when
# the theme defines info elements, and OPL only offers the "Info" hint on the
# main page under that same condition.
#
# Laid out like a store page. The _BG art is the hero, with the cover and the
# logo overlapping its lower edge and the metadata underneath.
#
# Widescreen
#   The hero is scaled and centred, so it keeps its shape instead of stretching.
#   In 4 by 3 that fills the screen exactly; in 16 by 9 it is a centred band with
#   the flat backdrop showing at the edges. Filling the width in both would mean
#   distorting it in one, since the source art has only one shape.
#
# Patterns
#   COV  box art, portrait          LGO  logo, transparent
#   BG   wallpaper, landscape       SCR / SCR2  screenshots
# Only ICO and COV are known to OPL itself, as the presets behind ItemIcon and
# ItemCover. Everything else is naming convention, so any string works as long
# as files in the device's ART folder match. Add SERIAL_SCR.png there and the
# screenshot slot below fills in; add a second GameImage with pattern SCR2 if
# you have those too and can find the room.
#
# Metadata carries no labels. display of 2 prints the value alone, and an empty
# value draws nothing at all, so absent fields leave no gap.
# ------------------------------------------------------------------------------

info0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# Hero. Scaled and centred so it never distorts.
info1:
	type=GameImage
	pattern=BG
	default=hero
	x=POS_MID
	y=149
	width=DIM_INF
	height=298
	aligned=1
	count=2

info2:
	type=ItemCover
	default=tile
	x=35
	y=170
	width=150
	height=225
	aligned=0
	count=3

# Bottom right, overlapping the hero's edge like the cover does, and small
# enough to leave the middle of the artwork visible.
info3:
	type=GameImage
	pattern=LGO
	default=logo
	x=430
	y=196
	width=160
	height=111
	aligned=0
	count=2

