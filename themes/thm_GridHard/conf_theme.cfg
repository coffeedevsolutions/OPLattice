# Grid / Hard
#
# Brutalist. Opaque slabs, hard borders, no gradient anywhere, one accent colour
# used only for the selection frame.
#
# Needs patches 01 and 02. On stock OPL the grid keys are ignored, main6 falls
# back to a plain text list, and the RecentImage elements are dropped as unknown
# types.
#
# Widescreen behaviour
#   The bars are scaled=0 with DIM_INF width, so they stretch edge to edge and
#   their contents spread out with the screen, which is what you want for a
#   full-bleed header and footer.
#   The grid is scaled=1 and centred on POS_MID, so both the tiles and the cell
#   pitch narrow by 3/4 and it stays a centred block at the same proportions.
#   Text never stretches either way -- OPL rasterises glyphs at 3/4 width in
#   anamorphic mode.
#
# Recently played band
#   index 0 uses the game's _BG art as a wide banner, 141x66. Source BG art is
#   460x215, so 141 wide keeps that shape at the same 66px height as the three
#   _COV thumbnails beside it.
#
# Grid geometry, 5 columns x 2 rows of 91x143 cells
#   art    77 x 115   (2 by 3, matches box art)
#   gap    14
#   label  14         (label_height, tightened for the 12px caption font)

bg_color=#0A0C0F
text_color=#8894A2
ui_text_color=#5868B4
sel_text_color=#FF4D2E
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# --- header -------------------------------------------------------------------
main1:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=52

main2:
	type=StaticText
	value=LIBRARY
	x=35
	y=12
	aligned=0
	font=1
	color=#F2F5F8

main3:
	type=MenuText
	x=205
	y=22
	width=120
	height=20
	aligned=0
	color=#5C6674

main4:
	type=GameCountText
	x=-92
	y=22
	aligned=1
	color=#5C6674

# Invisible, and declared BEFORE anything else that uses COV. findDuplicate
# hands every COV element the first cache created for that pattern, so this one
# has to be first and has to be sized for all of them, meaning the 10 grid
# tiles plus the 3 cover thumbnails in the recent band.
main5:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=13

# --- recently played ----------------------------------------------------------
# Its own band above the grid. index 0 is the most recent launch, drawn from the
# game's _BG art as a wide banner; 1-3 are ordinary covers. These read OPL's
# global recent list, so it survives switching device -- but art resolves through
# the CURRENT device's ART folder, so a game last played elsewhere falls back to
# `default`.
main6:
	type=StaticText
	value=RECENTLY PLAYED
	x=35
	y=62
	aligned=0
	font=2
	color=#5C6674

main7:
	type=RecentImage
	pattern=BG
	default=banner
	x=35
	y=80
	width=141
	height=66
	aligned=0
	count=2

main8:
	type=RecentImage
	default=tile
	index=1
	x=184
	y=80
	width=44
	height=66
	aligned=0

main9:
	type=RecentImage
	default=tile
	index=2
	x=236
	y=80
	width=44
	height=66
	aligned=0

main10:
	type=RecentImage
	default=tile
	index=3
	x=288
	y=80
	width=44
	height=66
	aligned=0

main11:
	type=RecentText
	x=346
	y=82
	width=250
	height=20
	aligned=0
	color=#F2F5F8

main12:
	type=RecentText
	index=1
	x=346
	y=106
	width=250
	height=18
	aligned=0
	font=2
	color=#5C6674

main13:
	type=RecentText
	index=2
	x=346
	y=124
	width=250
	height=18
	aligned=0
	font=2
	color=#5C6674

# --- the library --------------------------------------------------------------
# Centred on POS_MID so it stays centred when it narrows in widescreen.
main14:
	type=ItemsList
	x=POS_MID
	y=297
	width=455
	height=286
	aligned=1
	columns=5
	cell_width=91
	cell_height=143
	gap=14
	text=1
	frame=3
	decorator=COV
	font=2
	label_height=14

# --- footer -------------------------------------------------------------------
main15:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-40
	width=DIM_INF
	height=40

main16:
	type=HintText
	x=35
	y=-32
	aligned=0
