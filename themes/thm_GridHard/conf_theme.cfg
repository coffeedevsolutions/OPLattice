# Grid / Hard
#
# Brutalist. Opaque slabs, hard 2px borders, no gradient anywhere, one accent
# colour used only for the selection frame.
#
# Needs patches/opl-tile-grid.patch. On stock OPL the grid keys are ignored and
# main5 falls back to a plain text list.
#
# Grid geometry, 5 columns x 2 rows of 114x176 cells
#   art   100 x 148   (essentially 2 by 3, matches box art)
#   gap    14         (cell pitch minus art)
#   label  14         (label_height, tightened for the 12px caption font)

bg_color=#0A0C0F
text_color=#8894A2
ui_text_color=#5868B4
sel_text_color=#FF4D2E
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main1:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=80

main2:
	type=MenuText
	x=214
	y=34
	width=120
	height=20
	aligned=0
	color=#5C6674

main3:
	type=GameCountText
	x=44
	y=52
	aligned=0
	font=2
	color=#5C6674

# Invisible. Owns the COV cache that main5's tiles draw from.
main4:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=10

main5:
	type=ItemsList
	x=35
	y=86
	width=570
	height=352
	columns=5
	cell_width=114
	cell_height=176
	gap=14
	text=1
	frame=3
	decorator=COV
	font=2
	label_height=14

main6:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-40
	width=DIM_INF
	height=40

main7:
	type=HintText
	x=POS_MID
	y=-32
	aligned=1

main8:
	type=StaticText
	value=LIBRARY
	x=44
	y=22
	aligned=0
	font=1
	color=#F2F5F8

# --- recently played ----------------------------------------------------------
# RecentImage needs 02-opl-sort-and-recent.patch. index 0 is the most recent
# launch. It reads OPL's own list, which is global, so it survives switching
# device -- but art resolves through the CURRENT device's ART folder, so a game
# last played elsewhere falls back to `default`.
main9:
	type=StaticText
	value=RECENT
	x=360
	y=12
	aligned=0
	font=2
	color=#5C6674

main10:
	type=RecentImage
	default=tile
	x=360
	y=28
	width=39
	height=44
	aligned=0
	count=4

main11:
	type=RecentImage
	default=tile
	index=1
	x=404
	y=28
	width=39
	height=44
	aligned=0

main12:
	type=RecentImage
	default=tile
	index=2
	x=448
	y=28
	width=39
	height=44
	aligned=0

main13:
	type=RecentImage
	default=tile
	index=3
	x=492
	y=28
	width=39
	height=44
	aligned=0
