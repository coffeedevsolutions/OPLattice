# Grid / Hard -- what is left of it
#
# This theme used to define two full element chains and shipped nineteen images
# to draw them with. All of it served menuRenderMain and menuRenderInfo, and
# those are the only two functions in OPL that draw theme elements at all
# (menusys.c:1198-1309). Both are screens the shell replaced, and since Settings
# learned to return to the page that opened it, neither is reachable any more:
# boot goes to the shell, the rail routes only to shell pages and Settings, and
# the per-game menu returns to the details page. GUI_SCREEN_MAIN survives as an
# error path for a device pulled mid-menu, nothing else.
#
# So the chains and their images are gone. That is 2.80 MB of EE RAM, paid at
# theme load whether or not anything ever drew them -- initImageTexture decodes
# every element image up front. It is NOT a VRAM saving: a texture only reaches
# VRAM when it is drawn, and these never were.
#
# What is still load-bearing here, and why the file is not simply deleted:
#
#   fonts 5-8    The shell reads these by number through gTheme->fonts[], which
#                is the whole of its relationship with the theme system. Lose
#                them and every SHELF page falls back to the embedded face.
#   fonts 0-4    dia.c draws every dialog with gTheme->fonts[0].
#   the colours  Settings and the per-game/cheat menu ARE still reachable, and
#                they draw guiDrawBGPlasma plus dia.c widgets, which take their
#                colours from these four keys and from nothing else. They are
#                the only part of this file with a visible effect left.
#   pslogo.png   opened by path from shelf.c, not through any element key.
#   settings.png likewise.
#
# The four colours are the tan sheet now, so the two screens you can still reach
# stop announcing themselves as a different program:
#
#   bg_color        the plasma base                     (gui.c:1421)
#   text_color      dialog titles and unfocused rows     (dia.c:43, 96)
#   sel_text_color  the focused row, and OK/Cancel       (dia.c:43, 321)
#   ui_text_color   enum values and command hints        (dia.c:112, 422)
#
# Selected is the STRONGER of the two, which is the inverse of what a dark theme
# wants and the same way round as every SHELF page: ink for what you are on,
# muted for what you are not.

bg_color=#C9BFA6
text_color=#6B604F
ui_text_color=#3A2E22
sel_text_color=#3A2E22
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12
# Slot 3 is the smallest text on the page, for the title count and L1/R1.
font3=NotoSans-Bold.ttf
font3_size=10
# Slot 4 is the tile caption, a quarter smaller than slot 2.
font4=NotoSans-Bold.ttf
font4_size=9

# Slots 5-7 belong to the SHELF pages, which read them by number from shelf.c
# rather than through any element key. Nothing in the info chain references
# them, so the classic screens keep NotoSans and only the hardcoded pages
# change face. Renumbering these means editing SHELF_FNT_* in shelf.c.
#
# SUSE Mono for anything that has to survive being read on a television. It is
# the only candidate that stays legible at 9px once anamorphic 16:9 rasterises
# it at three quarters width, and being monospace it columns the landing page's
# value stream for free -- which is most of what makes that column read as
# output rather than as prose. Medium rather than Regular: the extra weight is
# what carries 9px across a composite-era panel. Never the variable file, whose
# default instance is Thin and which fntLoadSlot has no way to re-instance.
font5=SUSEMono-Medium.ttf
font5_size=12
font6=SUSEMono-Medium.ttf
font6_size=9

# The clock. SUSE again, one weight up: it is the largest number on the page and
# Medium goes weedy at 46px, while Bold turns slab. The clock is content -- it is
# the thing the panel is for -- so it takes the content face.
font7=SUSEMono-SemiBold.ttf
font7_size=46

# Headers, and only headers. Bitcount is a dot-grid face that reads as an
# instrument rather than as type, which is the right register for labelling a
# schematic and the wrong one for anything you have to read a sentence of. So it
# names the panels -- CLOCK, SYSTEM, RECENTLY PLAYED -- and never says anything.
#
# Eleven, not nine. The dot grid stops resolving below 11px once anamorphic 16:9
# rasterises it at three quarters width: the lettering closes up and the whole
# point of the face is lost. SemiBold for the same reason as before, Regular
# goes airy on tan and Bold merges the dots into strokes.
font8=BitcountGrid-SemiBold.ttf
font8_size=11
