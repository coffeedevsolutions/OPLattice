# Grid / Hard
#
# Brutalist. Opaque slabs, hard 2px borders, no gradient anywhere, one accent
# colour used only for the selection frame.
#
# Needs patches/opl-tile-grid.patch. On stock OPL the grid keys are ignored and
# main5 falls back to a plain text list.
#
# Grid geometry, 5 columns x 2 rows of 114x183 cells
#   art   100 x 150   (2 by 3, matches box art)
#   gap    14         (cell pitch minus art)
#   label  19         (one text line, reserved unless text is 0)

bg_color=#0A0C0F
text_color=#8894A2
ui_text_color=#5868B4
sel_text_color=#FF4D2E
use_default=1

default_font=PoeVeticaNew.ttf
default_font_size=17
font1=PoeVeticaNew.ttf
font1_size=26

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main1:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=56

main2:
	type=MenuText
	x=214
	y=22
	width=120
	height=20
	aligned=0
	color=#5C6674

main3:
	type=GameCountText
	x=-90
	y=24
	aligned=1
	color=#5C6674

# Invisible. Owns the COV cache that main5's tiles draw from.
main4:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=10

main5:
	type=ItemsList
	x=35
	y=74
	width=570
	height=366
	columns=5
	cell_width=114
	cell_height=183
	gap=14
	text=1
	frame=3
	decorator=COV

main6:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-40
	width=DIM_INF
	height=40

main7:
	type=HintText
	x=POS_MID
	y=-32
	aligned=1

main8:
	type=StaticText
	value=LIBRARY
	x=44
	y=12
	aligned=0
	font=1
	color=#F2F5F8
