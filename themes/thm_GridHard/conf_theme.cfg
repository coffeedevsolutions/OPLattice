# Grid / Hard
#
# Brutalist. Opaque slabs, hard borders, no gradient anywhere, one accent colour
# used only for the selection frame.
#
# Needs patches 01 and 02. On stock OPL the grid keys are ignored, main6 falls
# back to a plain text list, and the RecentImage elements are dropped as unknown
# types.
#
# Widescreen behaviour
#   The bars are unscaled with DIM_INF width, so they stretch edge to edge and
#   their contents spread out with the screen, which is what you want for a
#   full-bleed header and footer.
#   The grid is scaled and left-anchored, so both the tiles and the cell
#   pitch narrow by 3/4 and it stays a centred block at the same proportions.
#   Text never stretches either way -- OPL rasterises glyphs at 3/4 width in
#   anamorphic mode.
#
# Recently played
#   Just the newest launch, in its own band above the grid. The banner is left
#   aligned with the title beside it, and is drawn from the game's _BG art at
#   170x80. Source BG art is 460x215, so those numbers keep its shape.
#
# Button hints
#   circle.png, cross.png, triangle.png, square.png, start.png and select.png in
#   this folder replace OPL's button graphics with plain outlines and bars.
#   Any icon in the BDM_ICON..START_ICON range can be overridden this way, no
#   patch needed. Delete one and OPL falls back to its own, because use_default
#   is 1.
#
# Grid geometry, 6 columns x 2 rows of 88x136 cells
#   art    74 x 111   (2 by 3, matches box art)
#   gap    14
#   label  11         (label_height, tightened for the 9px caption font)
#
# Two rows show 12 of the library at once and let Down move within the page
# before it scrolls, which one row cannot. The cell height is set by the space
# left under the CONTINUE band; the art width then follows from keeping 2 by 3,
# and the cell width from that. 6 x 88 is 528, so centring starts the first tile
# 56 in -- which is why the CONTINUE band and BROWSE sit there too.
#
# 88 is deliberately a multiple of 4. rmWideScale is an integer (n * 3) >> 2, so
# a multiple of 4 narrows exactly and the grid edge stays on a whole pixel in
# widescreen. Those elements then set x_scaled so their own x narrows by the
# same rule, and the left rule holds in both aspects.
#
# Twelve tiles resident at once is a VRAM question before it is a RAM one, and
# it is the tighter of the two. Keep the _COV files at or under 100x150. At
# 128x192 this layout leaves only about 60 KB spare in a budget that is itself
# an estimate. The previewer's VRAM panel is the check.
#
# One row, so the cells take all the height left under the CONTINUE band and the
# covers get as large as 480 lines allow. Down pages to the next row, which is
# the closest OPL gets to scrolling. Element positions are fixed, so the band
# above cannot scroll away with the list. See themes/README.md.

bg_color=#0A0C0F
text_color=#8894A2
ui_text_color=#F2F5F8
sel_text_color=#FF4D2E
use_default=1

default_font=NotoSans-Bold.ttf
default_font_size=17
font1=NotoSans-Bold.ttf
font1_size=26
# Slot 2 is the tile caption. Smaller type fits more of each title before
# fntRenderString clips the line.
font2=NotoSans-Bold.ttf
font2_size=12
# Slot 3 is the smallest text on the page, for the title count and L1/R1.
font3=NotoSans-Bold.ttf
font3_size=10
# Slot 4 is the tile caption, a quarter smaller than slot 2.
font4=NotoSans-Bold.ttf
font4_size=9

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# --- header -------------------------------------------------------------------
main1:
	type=StaticImage
	default=topbar
	aligned=0
	scaled=0
	x=0
	y=0
	width=DIM_INF
	height=52

main2:
	type=StaticText
	value=LIBRARY
	x=35
	y=8
	aligned=0
	font=1
	color=#FFFFFF

# Every visible device at once, centred, with the current one framed in white
# and L1/R1 marking the buttons that move between them. Needs patch 03; on an
# unpatched build this is an unknown type and simply does not draw, so keep a
# MenuText around if that matters to you.
main3:
	type=MenuTabs
	x=POS_MID
	y=17
	width=10
	height=20
	aligned=1
	pad=13
	font=2
	color=#5C6674
	sel_color=#FFFFFF
	sel_text_color=#0A0C0F
	cap_left=cap_l
	cap_right=cap_r
	prev_text=L1
	next_text=R1
	hint_font=3
	hint_color=#4A5462
	# Keyed per device type, not per BDM slot -- a USB stick and an MX4SIO
	# card are both BDM devices and would otherwise share one label.
	label_usb=USB
	label_mx4sio=SD
	label_ilink=ILINK
	label_bdm=MASS
	label_eth=NET
	label_hdd=HDD
	label_app=APPS

# A suffix replaces the localised "Files found" wording with "17 TITLES".
main4:
	type=GameCountText
	suffix= TITLES
	x=36
	y=36
	aligned=0
	font=3
	color=#5C6674

# Invisible, and declared BEFORE anything else that uses COV. findDuplicate
# hands every COV element the first cache created for that pattern, so this one
# has to be first and has to be sized for the 10 grid tiles.
main5:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=12

# --- most recently played -----------------------------------------------------
# One entry, centred on the page like the tab strip and the grid. index 0 is the
# newest launch. It reads OPL's global recent list, so it survives switching
# device -- but art resolves through the CURRENT device's ART folder, so a game
# last played elsewhere falls back to `default`.
#
# Left aligned on the tiles' left edge, with the title beside the banner. The
# grid is centred, so in widescreen its left edge moves right as the tiles
# narrow while this band stays put -- element x is never aspect-corrected.
main6:
	type=StaticText
	value=CONTINUE
	x=56
	x_scaled=1
	y=58
	aligned=0
	font=2
	color=#5C6674

main7:
	type=RecentImage
	pattern=BG
	default=banner
	x=56
	x_scaled=1
	y=76
	width=141
	height=66
	aligned=0
	count=2

# Beside the banner, on its vertical centre.
main8:
	type=RecentText
	x=211
	x_scaled=1
	y=100
	width=410
	height=24
	aligned=0
	color=#F2F5F8

# Same treatment as CONTINUE, over the grid.
main9:
	type=StaticText
	value=BROWSE
	x=56
	x_scaled=1
	y=152
	aligned=0
	font=2
	color=#5C6674

# --- the library --------------------------------------------------------------
# Centred on POS_MID, like the tab strip above it. The patch centres a grid on
# its widescreen-corrected width, so it stays centred under the strip in both
# aspects rather than drifting left as the tiles narrow.
main10:
	type=ItemsList
	x=POS_MID
	y=310
	width=528
	height=272
	aligned=1
	columns=6
	cell_width=88
	cell_height=136
	gap=14
	text=1
	frame=3
	decorator=COV
	font=4
	label_height=11

# --- footer -------------------------------------------------------------------
main11:
	type=StaticImage
	default=botbar
	aligned=0
	scaled=0
	x=0
	y=-30
	width=DIM_INF
	height=30

main12:
	type=HintText
	x=35
	y=-26
	aligned=0
	font=2
	color=#8894A2

# ------------------------------------------------------------------------------
# INFO PAGE  --  press SQUARE on a title
#
# Stock OPL, no patch. itemExecSquare switches to GUI_SCREEN_INFO, but only when
# the theme defines info elements, and OPL only offers the "Info" hint on the
# main page under that same condition.
#
# Widescreen, and why the hero is 399 tall
#   The 640x480 buffer is stretched to fill a 16 by 9 screen, so a rect that is
#   full width displays 4/3 wider than it measures. For the 460x215 source art
#   to come out undistorted at full width it therefore needs 399 rows, not 299.
#   One rect cannot be right in both aspects. This file is tuned for 16 by 9,
#   where the hero fills the width and keeps its shape. On a 4 by 3 screen the
#   same hero looks vertically stretched. To flip that, set height to 299.
#
#   The content sits on an opaque band starting at row 300, which hides the part
#   of the hero the layout does not need and gives text a predictable ground --
#   game art is far too unpredictable to put text on directly.
#
# Patterns
#   COV  box art, portrait          BG   wallpaper, landscape
#   SCR / SCR2  screenshots         LGO  logo, transparent
#
# No LGO element here on purpose. A 400x440 logo is 704 KB of VRAM, the largest
# single texture these themes touched, and the hero already identifies the game.
# Dropping it means the _LGO files need not be shipped or downscaled at all.
# Only ICO and COV are known to OPL itself, as the presets behind ItemIcon and
# ItemCover. Everything else is naming convention, so any string works as long
# as files in the device's ART folder match. Add SERIAL_SCR.png there and the
# screenshot slot below fills in.
#
# Metadata carries no labels. A display of 2 prints the value alone, and an
# empty value draws nothing, so absent fields leave no gap.
# ------------------------------------------------------------------------------

info0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

# BG at its own size, not blown up. Source art is 460x215; a 345x215 rect on a
# 16 by 9 screen displays as exactly 557x180, because the 640x480 buffer is
# stretched 4/3 horizontally. So the art is carried 1 to 1 with no upscaling.
#
# The frame is 3.097 to 1 because that is the shape of the source art. The
# earlier 460x215 files were a 2.14 to 1 crop of the same images and lost about
# a third of the width -- on art with a figure at one edge, a whole character.
# tools/make-bg.py rebuilds them from the originals at the full width.
#
# On a 4 by 3 screen the same rect displays 418x180 and the art looks narrow.
# This page is tuned for 16 by 9. To flip it, set width to 557.
info1:
	type=GameImage
	pattern=BG
	default=hero
	x=0
	y=0
	width=418
	height=180
	aligned=0
	scaled=0
	count=2

# A transparent-to-background ramp ending exactly on the BG's right edge at 345,
# so the art dissolves into the page instead of stopping on a hard vertical cut.
info2:
	type=StaticImage
	default=fade
	x=373
	y=0
	width=45
	height=180
	aligned=0
	scaled=0

# Centred on the BG's own row -- the BG spans y 0..215, so its centre is 107.
# Art is normalised to one 200x120 canvas by tools/make-logos.py, because the
# source logos run from 49 to 440 tall and OPL always fills the rect. 150x120
# here displays as 200x120, matching the canvas 1 to 1.
info3:
	type=GameImage
	pattern=LGO
	default=tile
	x=529
	y=90
	width=150
	height=120
	aligned=1
	scaled=0
	count=2

