# Grid / Editorial
#
# Swiss-poster take. Paper ground, black rules, no fills, no shadows, no
# translucency. Type and white space do the work, and the accent appears only on
# the selection frame.
#
# Needs patches/opl-tile-grid.patch. On stock OPL the grid keys are ignored and
# main5 falls back to a plain text list.
#
# Grid geometry, 5 columns x 2 rows of 114x183 cells
#   art   100 x 150   (2 by 3, matches box art)
#   gap    14
#   label  19

bg_color=#F6F4F0
text_color=#3A3A38
ui_text_color=#5868B4
sel_text_color=#D6202A
use_default=1

default_font=PoeVeticaNew.ttf
default_font_size=17
font1=PoeVeticaNew.ttf
font1_size=30

main0:
	type=Background
	default=backdrop
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF

main1:
	type=MenuText
	x=258
	y=30
	width=130
	height=20
	aligned=0
	color=#8A8A86

main2:
	type=GameCountText
	x=-104
	y=30
	aligned=1
	color=#8A8A86

# Hard rule under the masthead. A 2px source image drawn at 2px, so it stays
# crisp rather than resampling to a soft line.
main3:
	type=StaticImage
	default=rule
	aligned=0
	scaled=0
	x=35
	y=62
	width=570
	height=2

main4:
	type=ItemCover
	default=tile
	width=0
	height=0
	count=10

main5:
	type=ItemsList
	x=35
	y=80
	width=570
	height=366
	columns=5
	cell_width=114
	cell_height=183
	gap=14
	text=1
	frame=3
	decorator=COV

main6:
	type=StaticImage
	default=rule_thin
	aligned=0
	scaled=0
	x=35
	y=-38
	width=570
	height=1

main7:
	type=HintText
	x=35
	y=-26
	aligned=0

main8:
	type=StaticText
	value=LIBRARY
	x=58
	y=18
	aligned=0
	font=1
	color=#161618
